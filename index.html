            );
        };

        // ============================================================
        // 採寸ビュー（2回目来店〜 / 17部位 + 体重）
        // ============================================================
        const MeasurementView = ({ customer, updateCustomer, gotoTab }) => {
            const today = todayLocalYMD();
            const measurements = customer ? (customer.measurements || []) : [];
            const todaySet = measurements.find(m => m.date === today);
            const [values, setValues] = useState(() => (todaySet ? { ...todaySet.values } : {}));
            const [weight, setWeight] = useState(todaySet ? (todaySet.weight || '') : '');
            const [editingDate, setEditingDate] = useState(today);
            const prevSet = useMemo(() => {
                const others = measurements.filter(m => m.date !== editingDate && m.date < editingDate);
                return others.length ? others[others.length - 1] : null;
            }, [measurements, editingDate]);
            const firstSet = measurements.length ? measurements[0] : null;

            useEffect(() => {
                const s = measurements.find(m => m.date === editingDate);
                setValues(s ? { ...s.values } : {});
                setWeight(s ? (s.weight || '') : '');
            }, [editingDate, customer && customer.id]);

            if (!customer) {
                return <EmptyState icon="👥" title="お客様を選択してください" message="ホームでお客様を選択すると採寸を記録できます。" />;
            }

            const setVal = (key, v) => setValues(prev => ({ ...prev, [key]: v }));
            const filledCount = MEASUREMENT_SITES.filter(s => values[s.key]).length;

            const save = () => {
                if (filledCount === 0 && !weight) { showToast('数値を入力してください', 'warning'); return; }
                updateCustomer(customer.id, c => {
                    const ms = (c.measurements || []).filter(m => m.date !== editingDate);
                    const newSet = { id: uid(), date: editingDate, weight: weight || '', values: { ...values } };
                    const sorted = [...ms, newSet].sort((a, b) => a.date < b.date ? -1 : 1);
                    return { ...c, measurements: sorted };
                });
                hapticSuccess();
                showToast(`${fmtDateShort(editingDate)} の採寸を保存しました`, 'success');
            };

            const diffBadge = (key) => {
                const cur = parseFloat(values[key]);
                const prev = prevSet && prevSet.values ? parseFloat(prevSet.values[key]) : NaN;
                if (isNaN(cur) || isNaN(prev)) return null;
                const d = Math.round((cur - prev) * 10) / 10;
                if (d === 0) return <span className="text-[9px] font-bold text-plum-200">±0</span>;
                return (
                    <span className="text-[10px] font-bold" style={{ color: d < 0 ? '#2F9C7C' : '#DA7A3C' }}>
                        {d > 0 ? '+' : ''}{d}
                    </span>
                );
            };

            return (
                <div className="space-y-4">
                    <div className="dear-hero rounded-3xl p-5 border border-dear-100 shadow-sm flex items-center gap-3">
                        <LogoMark size={46} radius={14} />
                        <div className="flex-1">
                            <div className="font-mincho font-bold text-plum-700">採寸（サイズ測定）</div>
                            <div className="text-[10px] text-plum-300 mt-0.5">{customer.name} 様　—　水着に着替えて17部位を測定</div>
                        </div>
                    </div>

                    <div className="dear-card p-4 space-y-3">
                        <div className="flex items-center gap-2">
                            <Field label="測定日" className="flex-1">
                                <input type="date" value={editingDate} max={today} onChange={e => setEditingDate(e.target.value)}
                                    className="w-full border rounded-lg px-2.5 py-2 text-sm" />
                            </Field>
                            <Field label="体重 (kg)" className="w-28">
                                <TextInput inputMode="decimal" value={weight} onChange={e => setWeight(e.target.value)} placeholder="—" />
                            </Field>
                        </div>
                        {prevSet && (
                            <div className="text-[10px] text-plum-300">
                                前回測定: {fmtDateShort(prevSet.date)}（{daysBetween(prevSet.date, editingDate)}日前）— 差分を自動表示します
                            </div>
                        )}
                    </div>

                    {MEASUREMENT_GROUPS.map(g => (
                        <div key={g} className="dear-card p-4">
                            <SectionTitle icon={g === '上半身' ? '💪' : g === 'お腹まわり' ? '🎀' : '🦵'}>{g}</SectionTitle>
                            <div className="grid grid-cols-2 gap-x-3 gap-y-2.5">
                                {MEASUREMENT_SITES.filter(s => s.group === g).map(site => (
                                    <div key={site.key}>
                                        <div className="flex items-center justify-between mb-1">
                                            <label className="text-[10px] font-bold text-plum-400">{site.label}</label>
                                            {diffBadge(site.key)}
                                        </div>
                                        <div className="relative">
                                            <input type="text" inputMode="decimal" value={values[site.key] || ''}
                                                onChange={e => setVal(site.key, e.target.value)}
                                                placeholder={prevSet && prevSet.values && prevSet.values[site.key] ? `前回 ${prevSet.values[site.key]}` : '—'}
                                                className="w-full border rounded-lg px-2.5 py-2 text-sm pr-9 text-right font-bold" />
                                            <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-plum-200 font-bold">cm</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}

                    <button onClick={save}
                        className="w-full py-3.5 rounded-2xl text-white font-bold text-sm shadow-lg"
                        style={{ background: 'linear-gradient(135deg,#E8837E,#C94D4D)' }}>
                        採寸を保存（{filledCount}/17部位 入力済み）
                    </button>

                    {/* 履歴サマリー */}
                    {measurements.length > 0 && (
                        <div className="dear-card p-4">
                            <SectionTitle icon="📈">採寸履歴（{measurements.length}回）</SectionTitle>
                            <div className="overflow-x-auto -mx-1 px-1">
                                <table className="w-full text-[11px]" style={{ minWidth: 480 }}>
                                    <thead>
                                        <tr>
                                            <th className="text-left py-1.5 pr-2 text-plum-300 font-bold whitespace-nowrap">部位</th>
                                            {measurements.slice(-4).map(m => (
                                                <th key={m.id} className="text-right py-1.5 px-2 text-plum-500 font-bold whitespace-nowrap">{fmtDateShort(m.date)}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[{ key: '_weight', label: '体重 (kg)' }, ...MEASUREMENT_SITES].map(site => {
                                            const vals = measurements.slice(-4).map(m => site.key === '_weight' ? m.weight : (m.values || {})[site.key]);
                                            if (vals.every(v => !v)) return null;
                                            return (
                                                <tr key={site.key} style={{ borderTop: '1px solid #F9F2F5' }}>
                                                    <td className="py-1.5 pr-2 text-plum-600 font-bold whitespace-nowrap">{site.label}</td>
                                                    {vals.map((v, i) => {
                                                        const prev = i > 0 ? parseFloat(vals[i - 1]) : NaN;
                                                        const cur = parseFloat(v);
                                                        const d = (!isNaN(cur) && !isNaN(prev)) ? Math.round((cur - prev) * 10) / 10 : null;
                                                        return (
                                                            <td key={i} className="py-1.5 px-2 text-right whitespace-nowrap">
                                                                <span className="font-bold text-plum-800">{v || '—'}</span>
                                                                {d != null && d !== 0 && (
                                                                    <span className="ml-1 text-[9px] font-bold" style={{ color: d < 0 ? '#2F9C7C' : '#DA7A3C' }}>
                                                                        {d > 0 ? '+' : ''}{d}
                                                                    </span>
                                                                )}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            {firstSet && measurements.length >= 2 && (
                                <div className="mt-3 rounded-xl p-3 text-[11px]" style={{ background: '#FAF8F0', border: '1px solid #E5DCBC' }}>
                                    <span className="font-bold text-gold-600">初回からの主な変化：</span>
                                    <span className="text-plum-500">
                                        {(() => {
                                            const latest = measurements[measurements.length - 1];
                                            const parts = [];
                                            if (firstSet.weight && latest.weight) {
                                                const d = Math.round((parseFloat(latest.weight) - parseFloat(firstSet.weight)) * 10) / 10;
                                                if (!isNaN(d) && d !== 0) parts.push(`体重 ${d > 0 ? '+' : ''}${d}kg`);
                                            }
                                            ['waist', 'navel', 'trochanter'].forEach(k => {
                                                const a = parseFloat((firstSet.values || {})[k]), b = parseFloat((latest.values || {})[k]);
                                                if (!isNaN(a) && !isNaN(b) && a !== b) {
                                                    const site = MEASUREMENT_SITES.find(s => s.key === k);
                                                    const d = Math.round((b - a) * 10) / 10;
                                                    parts.push(`${site.label} ${d > 0 ? '+' : ''}${d}cm`);
                                                }
                                            });
                                            return parts.length ? parts.join('　/　') : 'まだ大きな変化はありません';
                                        })()}
                                    </span>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // カメラ撮影・分析ビュー（正面・背面・側面）
        // ============================================================
        const CameraView = ({ customer, compData, setCompData, settings, onPhotoSaved, activeVisitN }) => {
            const [viewMode, setViewMode] = useState('front');
            const [phase, setPhase] = useState('idle'); // idle | loading | live | captured
            const [errorMsg, setErrorMsg] = useState('');
            const [landmarks, setLandmarks] = useState(null);
            const [analysis, setAnalysis] = useState(null);
            const [overlayOn, setOverlayOn] = useState(true);
            const [gridOn, setGridOn] = useState(true);
            const [scoreOverlayOn, setScoreOverlayOn] = useState(true);
            const [capturedImage, setCapturedImage] = useState(null);
            const [flowPhase, setFlowPhase] = useState('before'); // before | after
            const [cameraTilt, setCameraTilt] = useState(null);
            const orientationRef = useRef(null);
            const [refModal, setRefModal] = useState(null);
            const [advice, setAdvice] = useState('');
            const [saving, setSaving] = useState(false);
            const [singleDownloading, setSingleDownloading] = useState(false);

            // 手書き注釈
            const [drawMode, setDrawMode] = useState(false);
            const [drawColor, setDrawColor] = useState('#C94D4D');
            const [drawLineWidth, setDrawLineWidth] = useState(4);
            const [drawPaths, setDrawPaths] = useState([]);
            const drawCanvasRef = useRef(null);
            const isDrawing = useRef(false);

            // ランドマーク手動修正
            const [editMode, setEditMode] = useState(false);
            const [draggingIdx, setDraggingIdx] = useState(null);
            const editContainerRef = useRef(null);

            const videoRef = useRef(null);
            const streamRef = useRef(null);
            const poseRef = useRef(null);
            const animRef = useRef(null);
            const svgRef = useRef(null);
            const vpRef = useRef(null);
            const lmBufferRef = useRef([]);
            const LM_BUFFER_SIZE = 5;

            const isFirstVisit = activeVisitN === 1;

            useEffect(() => { return () => { stopCam(); }; }, []);

            const stopCam = useCallback(() => {
                if (animRef.current) cancelAnimationFrame(animRef.current);
                if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
                if (videoRef.current) videoRef.current.srcObject = null;
                if (orientationRef.current) {
                    window.removeEventListener('deviceorientation', orientationRef.current);
                    window.removeEventListener('deviceorientationabsolute', orientationRef.current);
                    orientationRef.current = null;
                }
            }, []);

            const startCamera = useCallback(async () => {
                setPhase('loading'); setErrorMsg(''); setAnalysis(null); setLandmarks(null); lmBufferRef.current = [];
                setCapturedImage(null); setAdvice('');
                let orientationPermitted = true;
                try {
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        const perm = await DeviceOrientationEvent.requestPermission();
                        orientationPermitted = (perm === 'granted');
                    }
                } catch (oe) { orientationPermitted = false; }
                try {
                    const s = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: { ideal: 'environment' },
                            zoom: { ideal: 0.5 },
                            advanced: [{ zoom: { min: 0.5, ideal: 0.5 } }] }
                    });
                    const track = s.getVideoTracks()[0];
                    if (track) {
                        try {
                            const caps = track.getCapabilities ? track.getCapabilities() : {};
                            if (caps.zoom) { await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }); }
                        } catch (e) {}
                    }
                    streamRef.current = s;
                    const v = videoRef.current;
                    v.srcObject = s; await v.play();

                    if (!window.Pose) {
                        await new Promise((res, rej) => {
                            const sc = document.createElement('script');
                            sc.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js';
                            sc.onload = res; sc.onerror = () => rej(new Error('MediaPipe読み込み失敗'));
                            document.head.appendChild(sc);
                        });
                        await new Promise(r => setTimeout(r, 500));
                    }
                    if (!poseRef.current) {
                        const pose = new window.Pose({
                            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`,
                        });
                        pose.setOptions({ modelComplexity: 2, smoothLandmarks: true, enableSegmentation: false,
                            minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
                        pose.onResults(r => {
                            if (r.poseLandmarks) {
                                lmBufferRef.current.push(r.poseLandmarks.map(lm => ({ x: lm.x, y: lm.y, z: lm.z, visibility: lm.visibility })));
                                if (lmBufferRef.current.length > LM_BUFFER_SIZE) lmBufferRef.current.shift();
                                setLandmarks(r.poseLandmarks);
                            }
                        });
                        await pose.initialize();
                        poseRef.current = pose;
                    }
                    setPhase('live');
                    const detect = async () => {
                        if (!streamRef.current) return;
                        try { await poseRef.current.send({ image: v }); } catch (e) {}
                        animRef.current = requestAnimationFrame(detect);
                    };
                    detect();
                    if (orientationPermitted) {
                        const onOrientation = (e) => {
                            if (e.beta == null && e.gamma == null) return;
                            setCameraTilt({ beta: Math.round(e.beta ?? 0), gamma: Math.round(e.gamma ?? 0) });
                        };
                        orientationRef.current = onOrientation;
                        window.addEventListener('deviceorientation', onOrientation);
                        window.addEventListener('deviceorientationabsolute', onOrientation);
                    }
                } catch (e) {
                    setPhase('idle'); setErrorMsg(e.message || 'カメラ起動失敗');
                }
            }, []);

            // 複数フレーム平均化
            const getAveragedLandmarks = useCallback(() => {
                const buf = lmBufferRef.current;
                if (buf.length === 0) return null;
                if (buf.length === 1) return buf[0];
                const numLm = buf[0].length;
                const averaged = [];
                for (let i = 0; i < numLm; i++) {
                    let sx = 0, sy = 0, sz = 0, sv = 0, count = 0;
                    let frames = buf;
                    if (buf.length >= 3) {
                        const sorted = [...buf].sort((a, b) => a[i].visibility - b[i].visibility);
                        frames = sorted.slice(1);
                    }
                    for (const f of frames) { sx += f[i].x; sy += f[i].y; sz += f[i].z; sv += f[i].visibility; count++; }
                    averaged.push({ x: sx / count, y: sy / count, z: sz / count, visibility: sv / count });
                }
                return averaged;
            }, []);

            const capture = useCallback(() => {
                const v = videoRef.current;
                const c = document.createElement('canvas');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                const imgData = c.toDataURL('image/jpeg', 0.92);
                setCapturedImage(imgData);
                const avgLm = getAveragedLandmarks();
                if (avgLm) setLandmarks(avgLm);
                stopCam();
                setPhase('captured');
                hapticSuccess();
            }, [stopCam, getAveragedLandmarks]);

            // 手書き注釈
            const redrawPaths = useCallback((paths) => {
                const canvas = drawCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                paths.forEach(path => {
                    if (path.points.length < 2) return;
                    ctx.beginPath();
                    ctx.strokeStyle = path.color;
                    ctx.lineWidth = path.width;
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.moveTo(path.points[0].x, path.points[0].y);
                    for (let i = 1; i < path.points.length; i++) ctx.lineTo(path.points[i].x, path.points[i].y);
                    ctx.stroke();
                });
            }, []);
            const getDrawPos = useCallback((e) => {
                const canvas = drawCanvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                return {
                    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
                    y: (touch.clientY - rect.top) * (canvas.height / rect.height),
                };
            }, []);
            const onDrawStart = useCallback((e) => {
                e.preventDefault();
                isDrawing.current = true;
                const pos = getDrawPos(e);
                setDrawPaths(prev => [...prev, { points: [pos], color: drawColor, width: drawLineWidth }]);
            }, [getDrawPos, drawColor, drawLineWidth]);
            const onDrawMove = useCallback((e) => {
                e.preventDefault();
                if (!isDrawing.current) return;
                const pos = getDrawPos(e);
                setDrawPaths(prev => {
                    const updated = [...prev];
                    const last = { ...updated[updated.length - 1] };
                    last.points = [...last.points, pos];
                    updated[updated.length - 1] = last;
                    redrawPaths(updated);
                    return updated;
                });
            }, [getDrawPos, redrawPaths]);
            const onDrawEnd = useCallback(() => { isDrawing.current = false; }, []);
            const undoDraw = useCallback(() => {
                setDrawPaths(prev => { const updated = prev.slice(0, -1); redrawPaths(updated); return updated; });
            }, [redrawPaths]);
            const clearDraw = useCallback(() => {
                setDrawPaths([]);
                const canvas = drawCanvasRef.current;
                if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            }, []);

            // 撮影確定 → セッション比較スロット + 顧客カルテ(IndexedDB)に保存
            const saveCapture = useCallback(async () => {
                if (!capturedImage || !landmarks || !analysis || saving) return;
                setSaving(true);
                try {
                    const data = { image: capturedImage, landmarks: [...landmarks], analysis: JSON.parse(JSON.stringify(analysis)) };
                    setCompData(prev => ({ ...prev, [flowPhase + '_' + viewMode]: data }));
                    if (customer) {
                        const resized = await resizeDataUrl(capturedImage, 1080, 0.86);
                        const thumb = await makeThumb(resized, 280);
                        const today = todayLocalYMD();
                        const todayVisit = (customer.visits || []).find(v => v.date === today);
                        await idbPutPhoto({
                            id: uid(),
                            customerId: customer.id,
                            visitId: todayVisit ? todayVisit.id : null,
                            visitN: todayVisit ? todayVisit.n : null,
                            date: today,
                            viewMode, phase: flowPhase,
                            image: resized, thumb,
                            landmarks: data.landmarks.map(l => ({ x: l.x, y: l.y, z: l.z, visibility: l.visibility })),
                            analysis: data.analysis,
                            totalScore: postureGetTotal(analysis),
                            createdAt: new Date().toISOString(),
                        });
                        onPhotoSaved && onPhotoSaved();
                        showToast(`${customer.name}様のカルテに${viewLabelOf(viewMode)}${flowPhase === 'after' ? 'アフター' : 'ビフォー'}を保存しました`, 'success');
                    } else {
                        showToast('この端末のセッションに保存しました（お客様を選択すると カルテに残ります）', 'info');
                    }
                    setCapturedImage(null); setAnalysis(null); setLandmarks(null); setPhase('idle'); setDrawPaths([]); setDrawMode(false); setAdvice('');
                } catch (e) {
                    console.error(e);
                    showToast('保存に失敗しました: ' + (e.message || e), 'error');
                } finally {
                    setSaving(false);
                }
            }, [capturedImage, landmarks, analysis, flowPhase, viewMode, customer, setCompData, onPhotoSaved, saving]);

            const retake = useCallback(() => {
                setCapturedImage(null); setAnalysis(null); setLandmarks(null); setEditMode(false); setAdvice('');
                startCamera();
            }, [startCamera]);
            const resetAll = useCallback(() => {
                stopCam(); setCapturedImage(null); setAnalysis(null); setLandmarks(null); setEditMode(false); setAdvice('');
                setPhase('idle');
            }, [stopCam]);

            // 分析実行
            useEffect(() => {
                if (!landmarks) return;
                setAnalysis(analyzeByView(landmarks, viewMode));
            }, [landmarks, viewMode]);

            // SVGオーバーレイ描画（ResizeObserverで回転にも追従）
            const [vpSize, setVpSize] = useState({ w: 0, h: 0 });
            useEffect(() => {
                if (!vpRef.current || typeof ResizeObserver === 'undefined') return;
                const ro = new ResizeObserver((entries) => {
                    const r = entries[0];
                    if (!r) return;
                    const cr = r.contentRect;
                    setVpSize(prev => (prev.w === cr.width && prev.h === cr.height) ? prev : { w: cr.width, h: cr.height });
                });
                ro.observe(vpRef.current);
                return () => ro.disconnect();
            }, []);

            useEffect(() => {
                if (!landmarks || !svgRef.current || !vpRef.current) return;
                const svg = svgRef.current;
                const w = vpRef.current.clientWidth, h = vpRef.current.clientHeight;
                svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
                let html = '';
                viewConnectionsOf(viewMode).forEach(([a, b]) => {
                    const la = landmarks[a], lb = landmarks[b];
                    if (!la || !lb || la.visibility < 0.5 || lb.visibility < 0.5) return;
                    html += `<line x1="${la.x * w}" y1="${la.y * h}" x2="${lb.x * w}" y2="${lb.y * h}" stroke="${SKELETON_LINE}" stroke-width="2.5" stroke-linecap="round"/>`;
                });
                if (viewMode === 'front' || viewMode === 'back') {
                    const ls = landmarks[11], rs = landmarks[12], lh = landmarks[23], rh = landmarks[24], nose = landmarks[0];
                    if (ls && rs && lh && rh) {
                        const sm = postureMid(ls, rs), hm = postureMid(lh, rh);
                        if (nose && nose.visibility >= 0.5) {
                            html += `<line x1="${nose.x * w}" y1="${nose.y * h}" x2="${sm.x * w}" y2="${sm.y * h}" stroke="${SKELETON_SPINE}" stroke-width="3" stroke-linecap="round"/>`;
                        }
                        html += `<line x1="${sm.x * w}" y1="${sm.y * h}" x2="${hm.x * w}" y2="${hm.y * h}" stroke="${SKELETON_SPINE}" stroke-width="3" stroke-linecap="round"/>`;
                        html += `<line x1="${hm.x * w}" y1="${Math.max(0, (nose ? nose.y : sm.y) - 0.08) * h}" x2="${hm.x * w}" y2="${Math.min(1, hm.y + 0.25) * h}" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6 4"/>`;
                        html += `<circle cx="${sm.x * w}" cy="${sm.y * h}" r="4" fill="${SKELETON_SPINE}" stroke="#fff" stroke-width="1.2"/>`;
                        html += `<circle cx="${hm.x * w}" cy="${hm.y * h}" r="4" fill="${SKELETON_SPINE}" stroke="#fff" stroke-width="1.2"/>`;
                    }
                } else {
                    const ankle = landmarks[27];
                    if (ankle && ankle.visibility >= 0.5) {
                        html += `<line x1="${ankle.x * w}" y1="${0.04 * h}" x2="${ankle.x * w}" y2="${Math.min(1, ankle.y + 0.05) * h}" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6 4"/>`;
                    }
                }
                viewPointsOf(viewMode).forEach(idx => {
                    const l = landmarks[idx];
                    if (!l || l.visibility < 0.5) return;
                    html += `<circle cx="${l.x * w}" cy="${l.y * h}" r="5" fill="${SKELETON_DOT}" stroke="#fff" stroke-width="1.5"/>`;
                });
                svg.innerHTML = html;
            }, [landmarks, analysis, phase, viewMode, overlayOn, vpSize]);

            // ランドマーク編集
            const editableIndices = useMemo(() => editableIndicesOf(viewMode), [viewMode]);
            const getPointerPos = useCallback((e) => {
                const container = editContainerRef.current;
                if (!container) return null;
                const rect = container.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                const x = (touch.clientX - rect.left) / rect.width;
                const y = (touch.clientY - rect.top) / rect.height;
                return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
            }, []);
            const handleEditPointerDown = useCallback((e, lmIdx) => {
                e.preventDefault(); e.stopPropagation();
                setDraggingIdx(lmIdx);
            }, []);
            const handleEditPointerMove = useCallback((e) => {
                if (draggingIdx === null || !landmarks) return;
                e.preventDefault();
                const pos = getPointerPos(e);
                if (!pos) return;
                const newLm = landmarks.map((lm, i) => i === draggingIdx ? { ...lm, x: pos.x, y: pos.y } : lm);
                setLandmarks(newLm);
                setAnalysis(analyzeByView(newLm, viewMode));
            }, [draggingIdx, landmarks, viewMode, getPointerPos]);
            const handleEditPointerUp = useCallback(() => { setDraggingIdx(null); }, []);

            // 端末に保存（合成画像 + 分析JSON）
            const downloadCurrentCapture = useCallback(async () => {
                if (!capturedImage || !analysis || !landmarks || singleDownloading) return;
                setSingleDownloading(true);
                try {
                    const viewLabel = viewLabelOf(viewMode);
                    const phaseLabel = flowPhase === 'after' ? 'After' : 'Before';
                    const name = customer ? customer.name.replace(/\s+/g, '_') : 'posture';
                    const date = todayLocalYMD().replace(/-/g, '');
                    const baseName = `Dear_${name}_${date}_${viewLabel}_${phaseLabel}`;
                    const composed = await postureComposeImage(capturedImage, landmarks, analysis, viewMode, scoreOverlayOn);
                    const ua = navigator.userAgent || '';
                    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                    const shared = await tryShareFiles([dataUrlToFile(composed, baseName + '.jpg')], baseName);
                    if (shared === 'abort') return;
                    if (!shared) {
                        downloadDataUrl(composed, baseName + '.jpg');
                        showToast(isIOS ? '「ファイル」アプリのダウンロードに保存されました' : '画像をダウンロードしました', 'success');
                    } else {
                        hapticSuccess();
                    }
                } catch (e) {
                    console.error(e);
                    showToast('保存に失敗しました', 'error');
                } finally {
                    setSingleDownloading(false);
                }
            }, [capturedImage, analysis, landmarks, viewMode, flowPhase, customer, scoreOverlayOn, singleDownloading]);

            const total = analysis ? postureGetTotal(analysis) : null;
            const beforeCount = ['front', 'back', 'side'].filter(v => compData['before_' + v]).length;

            return (
                <div className="space-y-4">
                    {/* ヘッダー */}
                    <div className="dear-hero rounded-3xl p-5 border border-dear-100 shadow-sm flex items-center gap-3">
                        <LogoMark size={46} radius={14} />
                        <div className="flex-1 min-w-0">
                            <div className="font-mincho font-bold text-plum-700">姿勢撮影・AI分析</div>
                            <div className="text-[10px] text-plum-300 mt-0.5 truncate">
                                {customer ? `${customer.name} 様${activeVisitN ? `　—　${activeVisitN}回目来店` : ''}` : 'お客様未選択（ホームで選択するとカルテに保存されます）'}
                            </div>
                        </div>
                        {total !== null && phase === 'captured' && <ScoreDonut score={total} size={54} />}
                    </div>

                    {/* Before/After 切替 */}
                    <div className="flex gap-1 p-1 rounded-2xl bg-white border border-dear-100 shadow-sm">
                        <button onClick={() => { setFlowPhase('before'); if (phase === 'captured') resetAll(); }}
                            className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5 ${flowPhase === 'before' ? 'text-white shadow' : 'text-plum-300'}`}
                            style={flowPhase === 'before' ? { background: 'linear-gradient(135deg,#904C63,#663347)' } : {}}>
                            Before（施術前）
                            {beforeCount > 0 && <span className="text-[9px] px-1.5 rounded-full bg-white/25">{beforeCount}</span>}
                        </button>
                        <button onClick={() => { setFlowPhase('after'); if (phase === 'captured') resetAll(); }}
                            className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5 ${flowPhase === 'after' ? 'text-white shadow' : 'text-plum-300'}`}
                            style={flowPhase === 'after' ? { background: 'linear-gradient(135deg,#E8837E,#C94D4D)' } : {}}>
                            After（施術後）
                        </button>
                    </div>
                    {/* 初回アフター注意 */}
                    {isFirstVisit && flowPhase === 'after' && (
                        <div className="rounded-xl p-3 text-[11px] leading-relaxed border" style={{ background: '#FAF8F0', color: '#8C7A4C', borderColor: '#E5DCBC' }}>
                            💡 <b>初回はアフターを撮らないのが基本フローです</b>（施術効果の持続を次回来店時に実感していただくため）。
                            早期クロージングでその場で変化を見せたい場合のみ、このままアフター撮影に進んでください。
                        </div>
                    )}

                    {/* ビュー切替（正面・背面・側面） */}
                    <div className="flex gap-1 p-1 rounded-2xl bg-white border border-dear-100 shadow-sm">
                        {['front', 'back', 'side'].map(m => {
                            const hasBefore = !!compData['before_' + m];
                            const hasAfter = !!compData['after_' + m];
                            return (
                                <button key={m} onClick={() => { setViewMode(m); if (phase === 'captured') resetAll(); }}
                                    className={`flex-1 py-2 rounded-xl text-sm font-bold transition relative ${viewMode === m ? 'text-white shadow' : 'text-plum-300'}`}
                                    style={viewMode === m ? { background: '#904C63' } : {}}>
                                    {viewLabelOf(m)}
                                    {(hasBefore || hasAfter) && (
                                        <span className="absolute -top-1 -right-1 flex gap-0.5">
                                            {hasBefore && <span className="w-1.5 h-1.5 rounded-full inline-block" style={{ background: '#904C63', outline: '1.5px solid #fff' }} />}
                                            {hasAfter && <span className="w-1.5 h-1.5 rounded-full inline-block" style={{ background: '#E8837E', outline: '1.5px solid #fff' }} />}
                                        </span>
                                    )}
                                </button>
                            );
                        })}
                    </div>

                    {/* ビューポート */}
                    <div ref={vpRef} className="relative rounded-3xl overflow-hidden shadow-lg" style={{ aspectRatio: '9/16', background: '#3E1F2C' }}>
                        <video ref={videoRef} playsInline muted className="w-full h-full object-cover" style={{ display: phase === 'live' ? 'block' : 'none' }} />
                        {capturedImage && <img src={capturedImage} className="w-full h-full object-cover" alt="captured" />}

                        {/* ランドマーク編集レイヤー */}
                        {editMode && phase === 'captured' && landmarks && (
                            <div ref={editContainerRef} className="absolute inset-0" style={{ zIndex: 10, touchAction: 'none' }}
                                onMouseMove={handleEditPointerMove} onMouseUp={handleEditPointerUp} onMouseLeave={handleEditPointerUp}
                                onTouchMove={handleEditPointerMove} onTouchEnd={handleEditPointerUp} onTouchCancel={handleEditPointerUp}>
                                {editableIndices.map(({ idx, label }) => {
                                    const lm = landmarks[idx];
                                    if (!lm) return null;
                                    const isDraggingThis = draggingIdx === idx;
                                    return (
                                        <div key={idx}
                                            style={{ position: 'absolute', left: `${lm.x * 100}%`, top: `${lm.y * 100}%`, transform: 'translate(-50%,-50%)', zIndex: isDraggingThis ? 20 : 11 }}
                                            onMouseDown={(e) => handleEditPointerDown(e, idx)}
                                            onTouchStart={(e) => handleEditPointerDown(e, idx)}>
                                            <div style={{ width: 42, height: 42, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: isDraggingThis ? 'grabbing' : 'grab' }}>
                                                <div style={{
                                                    width: isDraggingThis ? 26 : 20, height: isDraggingThis ? 26 : 20, borderRadius: '50%',
                                                    border: `3px solid ${isDraggingThis ? '#C0B084' : '#E8837E'}`,
                                                    background: isDraggingThis ? 'rgba(192,176,132,0.35)' : 'rgba(232,131,126,0.3)',
                                                    boxShadow: isDraggingThis ? '0 0 12px rgba(192,176,132,0.8)' : '0 0 8px rgba(232,131,126,0.6)',
                                                    display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'width .1s,height .1s',
                                                }}>
                                                    <div style={{ width: 5, height: 5, borderRadius: '50%', background: isDraggingThis ? '#C0B084' : '#E8837E' }} />
                                                </div>
                                            </div>
                                            <div style={{ position: 'absolute', top: -16, left: '50%', transform: 'translateX(-50%)', background: 'rgba(62,31,44,0.8)', color: '#fff', fontSize: 9, fontWeight: 'bold', padding: '1px 5px', borderRadius: 4, whiteSpace: 'nowrap', pointerEvents: 'none' }}>{label}</div>
                                        </div>
                                    );
                                })}
                                <div className="absolute top-2 left-2 right-2 flex items-center justify-center py-1.5 px-3 rounded-xl" style={{ background: 'rgba(201,77,77,0.92)', zIndex: 25 }}>
                                    <span className="text-white text-xs font-bold">修正モード — ポイントをドラッグして調整</span>
                                </div>
                            </div>
                        )}

                        {phase === 'idle' && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center gap-4">
                                <div className="w-20 h-20 rounded-3xl bg-white/95 flex items-center justify-center overflow-hidden" style={{ boxShadow: '0 6px 24px rgba(0,0,0,0.25)' }}>
                                    <img src={DEAR_LOGO_URL} alt="" style={{ width: 66, height: 66, objectFit: 'contain', opacity: 0.95 }} />
                                </div>
                                <p className="text-white/50 text-xs text-center px-6 leading-relaxed">
                                    {viewMode === 'front' ? '背面カメラでお客様の正面全身を撮影します' : viewMode === 'back' ? '背面カメラでお客様の後ろ姿全身を撮影します' : '背面カメラでお客様の左側面全身を撮影します'}
                                </p>
                            </div>
                        )}
                        {phase === 'loading' && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center gap-4" style={{ background: 'rgba(62,31,44,0.7)', backdropFilter: 'blur(4px)' }}>
                                <div className="w-10 h-10 rounded-full animate-spin" style={{ border: '3px solid rgba(255,255,255,0.2)', borderTopColor: '#E8837E' }} />
                                <p className="text-white text-sm">カメラ・AI読み込み中...</p>
                            </div>
                        )}
                        {(phase === 'live' || phase === 'captured') && overlayOn && (
                            <svg ref={svgRef} className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 3 }} preserveAspectRatio="none" />
                        )}
                        {/* 方眼グリッド */}
                        {(phase === 'live' || phase === 'captured') && gridOn && (
                            <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 2 }} viewBox="0 0 900 1600" preserveAspectRatio="none">
                                <rect x="60" y="280" width="780" height="1040" fill="none" stroke="rgba(201,77,77,0.55)" strokeWidth="3" />
                                {[1, 2, 3, 4, 5].map(i => <line key={`v${i}`} x1={60 + i * 130} y1="280" x2={60 + i * 130} y2="1320" stroke="rgba(201,77,77,0.4)" strokeWidth="1.5" />)}
                                {[1, 2, 3, 4, 5, 6, 7].map(i => <line key={`h${i}`} x1="60" y1={280 + i * 130} x2="840" y2={280 + i * 130} stroke="rgba(201,77,77,0.4)" strokeWidth="1.5" />)}
                                {[1, 2, 3, 4, 5, 6].map(i => <text key={`cl${i}`} x={60 + (i - 1) * 130 + 65} y="1355" textAnchor="middle" fill="rgba(201,77,77,0.75)" style={{ fontSize: 28, fontWeight: 700 }}>{i}</text>)}
                                {['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'].map((cc, i) => <text key={`rl${cc}`} x="30" y={280 + i * 130 + 75} textAnchor="middle" fill="rgba(201,77,77,0.75)" style={{ fontSize: 28, fontWeight: 700 }}>{cc}</text>)}
                                <line x1="450" y1="280" x2="450" y2="1320" stroke="rgba(144,76,99,0.85)" strokeWidth="2.5" />
                                <line x1="60" y1="800" x2="840" y2="800" stroke="rgba(144,76,99,0.85)" strokeWidth="2.5" />
                            </svg>
                        )}
                        {phase === 'live' && (
                            <div className="absolute top-3 right-3 flex flex-col items-end gap-1.5 z-10">
                                <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full" style={{ background: 'rgba(62,31,44,0.6)', backdropFilter: 'blur(6px)' }}>
                                    <div className="w-2 h-2 rounded-full animate-pulse" style={{ background: '#E8837E' }} /><span className="text-white text-xs font-bold">LIVE</span>
                                </div>
                                {cameraTilt && (() => {
                                    const fbTilt = cameraTilt.beta - 90;
                                    const lrTilt = cameraTilt.gamma;
                                    const absFb = Math.abs(fbTilt), absLr = Math.abs(lrTilt);
                                    const tiltOk = absFb <= 3 && absLr <= 3;
                                    const tiltWarn = absFb <= 6 && absLr <= 6;
                                    const tiltColor = tiltOk ? '#2F9C7C' : tiltWarn ? '#C0B084' : '#D34A6A';
                                    const bgColor = tiltOk ? 'rgba(47,156,124,0.3)' : tiltWarn ? 'rgba(192,176,132,0.3)' : 'rgba(211,74,106,0.35)';
                                    return (
                                        <div className="px-2.5 py-1.5 rounded-xl" style={{ background: bgColor, border: `1px solid ${tiltColor}55`, backdropFilter: 'blur(6px)' }}>
                                            <div className="flex items-center gap-2 text-white" style={{ fontSize: 10, fontWeight: 700 }}>
                                                <span style={{ color: tiltColor }}>傾き</span>
                                                <span>前後 {fbTilt > 0 ? '+' : ''}{fbTilt}°</span>
                                                <span>左右 {lrTilt > 0 ? '+' : ''}{lrTilt}°</span>
                                            </div>
                                            {!tiltOk && !tiltWarn && <div style={{ fontSize: 9, color: '#F6D2CF', marginTop: 2 }}>カメラを水平にしてください</div>}
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                        {phase === 'captured' && (
                            <div className="absolute top-3 right-3 px-2.5 py-1 rounded-full" style={{ background: 'rgba(62,31,44,0.6)', backdropFilter: 'blur(6px)' }}>
                                <span className="text-white text-xs font-bold">{flowPhase === 'after' ? 'After' : 'Before'} 撮影済み</span>
                            </div>
                        )}

                        {/* スコアオーバーレイ */}
                        {phase === 'captured' && analysis && total !== null && scoreOverlayOn && !editMode && landmarks && (
                            <React.Fragment>
                                <div className="absolute pointer-events-none" style={{ zIndex: 4, top: 8, left: 8 }}>
                                    <div style={{ background: 'rgba(62,31,44,0.72)', backdropFilter: 'blur(6px)', borderRadius: 12, padding: '6px 10px', display: 'flex', alignItems: 'center', gap: 7 }}>
                                        <div style={{ width: 34, height: 34, borderRadius: '50%', border: `3px solid ${postureScoreColor(total)}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                            <span style={{ fontSize: 13, fontWeight: 700, color: postureScoreColor(total) }}>{total}</span>
                                        </div>
                                        <div>
                                            <div style={{ fontSize: 10, fontWeight: 700, color: postureScoreColor(total) }}>{postureScoreLabel(total)}</div>
                                            <div style={{ fontSize: 7, color: 'rgba(255,255,255,0.6)' }}>{viewLabelOf(viewMode)}・8項目分析</div>
                                        </div>
                                    </div>
                                </div>
                                {analysis.items.map(item => {
                                    const pos = itemOverlayPos(item, landmarks, viewMode);
                                    if (!pos) return null;
                                    const isLow = item.confidence != null && item.confidence < 0.5;
                                    const color = isLow ? '#aaa' : postureScoreColor(item.score);
                                    return (
                                        <div key={item.key} className="absolute pointer-events-none" style={{
                                            zIndex: 4, left: `${pos.x * 100}%`, top: `${pos.y * 100}%`,
                                            transform: pos.align === 'center' ? 'translate(-50%, -100%)' : pos.align === 'right' ? 'translate(-100%, -50%)' : 'translate(0, -50%)',
                                        }}>
                                            <div style={{ background: 'rgba(62,31,44,0.75)', backdropFilter: 'blur(4px)', borderRadius: 6, padding: '3px 6px', borderLeft: `3px solid ${color}`, whiteSpace: 'nowrap' }}>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                                                    <span style={{ fontSize: 8, color: 'rgba(255,255,255,0.85)', lineHeight: 1 }}>{item.label}</span>
                                                    <span style={{ fontSize: 11, fontWeight: 700, color, lineHeight: 1 }}>{isLow ? '—' : item.score}</span>
                                                </div>
                                                <div style={{ fontSize: 7, color: 'rgba(255,255,255,0.55)', lineHeight: 1.3, marginTop: 1 }}>
                                                    {item.value}{item.valueCm && !isLow ? ' / ' + item.valueCm : ''}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </React.Fragment>
                        )}

                        {/* 手書きキャンバス */}
                        {phase === 'captured' && drawMode && (
                            <canvas ref={drawCanvasRef} className="absolute inset-0 w-full h-full"
                                style={{ zIndex: 8, touchAction: 'none', cursor: 'crosshair' }} width={1080} height={1920}
                                onTouchStart={onDrawStart} onTouchMove={onDrawMove} onTouchEnd={onDrawEnd}
                                onMouseDown={onDrawStart} onMouseMove={onDrawMove} onMouseUp={onDrawEnd} onMouseLeave={onDrawEnd} />
                        )}
                        {phase === 'captured' && drawMode && (
                            <div className="absolute top-3 left-3 z-20 flex flex-col gap-2">
                                <div className="flex gap-1 p-1.5 rounded-xl" style={{ background: 'rgba(62,31,44,0.7)', backdropFilter: 'blur(6px)' }}>
                                    {[{ c: '#C94D4D' }, { c: '#3B82F6' }, { c: '#C0B084' }, { c: '#FFFFFF' }, { c: '#1E293B' }].map(item => (
                                        <button key={item.c} onClick={() => setDrawColor(item.c)}
                                            style={{ width: 28, height: 28, borderRadius: 8, background: item.c, border: drawColor === item.c ? '3px solid #fff' : '2px solid rgba(255,255,255,0.3)', transition: 'all .15s', flexShrink: 0 }} />
                                    ))}
                                </div>
                                <div className="flex gap-1 p-1.5 rounded-xl" style={{ background: 'rgba(62,31,44,0.7)', backdropFilter: 'blur(6px)' }}>
                                    <button onClick={() => setDrawLineWidth(3)} className="px-3 py-1 rounded-lg text-white text-xs font-bold" style={{ background: drawLineWidth === 3 ? 'rgba(255,255,255,0.25)' : 'transparent' }}>細</button>
                                    <button onClick={() => setDrawLineWidth(7)} className="px-3 py-1 rounded-lg text-white text-xs font-bold" style={{ background: drawLineWidth === 7 ? 'rgba(255,255,255,0.25)' : 'transparent' }}>太</button>
                                    <div style={{ width: 1, background: 'rgba(255,255,255,0.2)', margin: '2px 4px' }} />
                                    <button onClick={undoDraw} className="px-3 py-1 rounded-lg text-white text-xs font-bold" disabled={drawPaths.length === 0}>戻す</button>
                                    <button onClick={clearDraw} className="px-3 py-1 rounded-lg text-white text-xs font-bold">クリア</button>
                                </div>
                            </div>
                        )}

                        {/* ビューポート内ボタン */}
                        {phase === 'live' && (
                            <div className="absolute bottom-0 left-0 right-0 p-4 flex gap-2 z-10" style={{ background: 'linear-gradient(transparent, rgba(62,31,44,0.75))' }}>

                                    {analysis && landmarks && !drawMode && (

                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838.838-2.872a2 2 0 0 1 .506-.855z" /></svg>

                    {/* 撮影ガイド */}
                    {phase !== 'captured' && (
                        <div className="dear-card p-4">
                            <div className="font-bold text-sm mb-2 text-plum-700">

                                ? '・お客様の後ろ姿を背面カメラで撮影<br>・両腕は自然に体の横に下ろしてもらう<br>・足は肩幅に開いてリラックス<br>・頭頂部から足先まで全身が映るように調整'

                            {isFirstVisit && flowPhase === 'before' && (

                    {/* 凡例 */}
                    {phase === 'captured' && analysis && (
                        <div className="flex gap-3 flex-wrap rounded-xl px-3 py-2 text-xs bg-white/70 border border-dear-100 text-plum-400">
                            {[{ c: '#2F9C7C', l: '良好' }, { c: '#B8912E', l: 'やや注意' }, { c: '#DA7A3C', l: '要改善' }, { c: '#D34A6A', l: '要施術' }].map(x => (
                                <span key={x.l} className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: x.c }} />{x.l}</span>
                            ))}

                    )}

                    {/* 分析結果 */}
                    {phase === 'captured' && analysis && total !== null && (
                        <div className="space-y-3">
                            <div className="dear-card p-4 md:p-5 flex items-center gap-4">
                                <ScoreDonut score={total} size={86} />
                                <div>
                                    <div className="font-bold text-sm mb-1 text-plum-800">{viewLabelOf(viewMode)}総合スコア　<span className="text-[10px] font-normal text-plum-300">8項目詳細分析</span></div>
                                    <div className="text-xs text-plum-400 leading-relaxed">
                                        {total >= 80 ? '姿勢は概ね良好です。現在の状態を維持しましょう。' : total >= 60 ? '軽度の歪みが見られます。月1〜2回の定期的なケアをおすすめします。' : total >= 40 ? '複数の項目で改善が必要です。集中ケアプランをご提案します。' : '姿勢の歪みが顕著です。早めの施術をおすすめします。'}
                                    </div>

                            </div>
                            <div className="space-y-2">
                                {analysis.items.map(item => {
                                    const isLow = item.confidence != null && item.confidence < 0.5;
                                    return (
                                        <div key={item.key} className="rounded-xl p-3" style={{ background: isLow ? '#F9F5F0' : postureScoreBg(item.score), opacity: isLow ? 0.7 : 1 }}>
                                            <div className="flex items-center justify-between">
                                                <div className="flex-1 min-w-0">
                                                    <div className="text-sm font-bold flex items-center gap-1.5 text-plum-800">
                                                        {item.label}
                                                        {isLow && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap" style={{ background: '#FAEADD', color: '#DA7A3C' }}>信頼度低</span>}
                                                        {!isLow && item.confidence != null && item.confidence < 0.7 && <span className="text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap" style={{ background: '#F7EFDA', color: '#B8912E' }}>やや低</span>}
                                                    </div>
                                                    <div className="text-xs text-plum-400 mt-0.5">
                                                        {isLow ? '再撮影推奨 — ' + item.value : item.detail + ' — ' + item.value + (item.valueCm ? '（約' + item.valueCm + '）' : '')}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 flex-shrink-0">
                                                    <div className="min-w-[44px] h-7 rounded-full flex items-center justify-center text-white text-sm font-bold" style={{ background: isLow ? '#aaa' : postureScoreColor(item.score) }}>{isLow ? '—' : item.score}</div>
                                                    {item.reference && (
                                                        <button onClick={(e) => { e.stopPropagation(); setRefModal(item); }}
                                                            className="w-7 h-7 rounded-full bg-white/70 flex items-center justify-center text-plum-300 hover:text-plum-500 transition" title="論文根拠を表示">
                                                            📖

                            </div>
                            {/* アドバイス（ローカル生成） */}
                            {!advice ? (
                                <button onClick={() => setAdvice(generateLocalAdvice(analysis, viewMode))}
                                    className="w-full flex items-center justify-center gap-2 py-3 rounded-2xl text-white font-bold text-sm shadow-lg"
                                    style={{ background: 'linear-gradient(135deg,#904C63,#663347)' }}>
                                    ✨ 改善アドバイスを生成
                                </button>
                            ) : (
                                <div className="rounded-2xl p-4 border" style={{ background: '#F9F2F5', borderColor: '#DFC0CD' }}>
                                    <div className="flex items-center gap-2 mb-2">
                                        <LogoMark size={22} radius={7} shadow={false} />
                                        <span className="text-xs font-bold text-plum-600">Dear改善アドバイス</span>
                                    </div>

                                    <button onClick={() => setAdvice('')} className="mt-2 text-[10px] text-plum-300 underline">閉じる</button>

                            )}
                            <div className="flex gap-2 pt-1">
                                <button onClick={downloadCurrentCapture} disabled={singleDownloading}
                                    className="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-2xl font-bold text-sm shadow-lg text-white"
                                    style={{ background: singleDownloading ? '#C9AEB6' : '#904C63' }}>
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
                                    {singleDownloading ? '保存中...' : '端末に保存'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 論文根拠モーダル */}
                    {refModal && (
                        <Modal onClose={() => setRefModal(null)} maxW="max-w-sm">
                            <ModalHeader title={refModal.label} subtitle="測定の学術的根拠" onClose={() => setRefModal(null)} plum={false} />
                            <div className="p-5 space-y-3 overflow-y-auto">
                                <div className="flex items-center gap-2">
                                    <div className="min-w-[44px] h-7 rounded-full flex items-center justify-center text-white text-sm font-bold" style={{ background: postureScoreColor(refModal.score) }}>{refModal.score}</div>
                                    <span className="text-sm text-plum-600">{refModal.detail} — {refModal.value}{refModal.valueCm ? '（約' + refModal.valueCm + '）' : ''}</span>
                                </div>
                                <div className="rounded-xl p-4 border" style={{ background: '#F9F2F5', borderColor: '#DFC0CD' }}>
                                    <div className="text-xs font-bold text-plum-600 mb-2">📚 査読付き学術論文</div>
                                    <div className="space-y-2 text-xs text-plum-500">
                                        <div><span className="font-bold text-plum-700">著者: </span>{refModal.reference.authors}</div>
                                        <div><span className="font-bold text-plum-700">年: </span>{refModal.reference.year}</div>
                                        <div><span className="font-bold text-plum-700">ジャーナル: </span>{refModal.reference.journal}</div>
                                        {refModal.reference.doi && (
                                            <div><span className="font-bold text-plum-700">DOI: </span>
                                                <a href={`https://doi.org/${refModal.reference.doi}`} target="_blank" rel="noopener noreferrer" className="text-dear-600 underline break-all">{refModal.reference.doi}</a></div>
                                        )}
                                        {refModal.reference.pmid && (
                                            <div><span className="font-bold text-plum-700">PubMed: </span>
                                                <a href={`https://pubmed.ncbi.nlm.nih.gov/${refModal.reference.pmid}/`} target="_blank" rel="noopener noreferrer" className="text-dear-600 underline">PMID: {refModal.reference.pmid}</a></div>
                                        )}
                                        <div className="pt-2" style={{ borderTop: '1px solid #DFC0CD' }}>
                                            <span className="font-bold text-plum-700">知見: </span>{refModal.reference.finding}
                                        </div>
                                    </div>
                                </div>
                                <p className="text-[10px] text-plum-200 text-center">本スコアリングは上記のPeer-Reviewed論文に基づいています</p>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        // ============================================================
        // 記録ビュー（写真ギャラリー / 比較 / PDF出力 / LINE送信）
        // ============================================================
        const RecordsView = ({ customer, photosVersion, compData, settings, gotoTab }) => {
            const [photos, setPhotos] = useState([]);
            const [loading, setLoading] = useState(false);
            const [filterView, setFilterView] = useState('all');
            const [viewer, setViewer] = useState(null); // photo object
            const [compareMode, setCompareMode] = useState(false);
            const [compareSel, setCompareSel] = useState([]); // [photoId, photoId]
            const [comparePreview, setComparePreview] = useState(null); // {dataUrl, before, after}
            const [pdfModalOpen, setPdfModalOpen] = useState(false);
            const [pdfSel, setPdfSel] = useState([]);
            const [pdfIncludeMeasure, setPdfIncludeMeasure] = useState(true);
            const [pdfBusy, setPdfBusy] = useState(false);
            const [shareBusy, setShareBusy] = useState(false);

            useEffect(() => {
                let alive = true;
                if (!customer) { setPhotos([]); return; }
                setLoading(true);
                idbGetPhotosByCustomer(customer.id).then(ps => {
                    if (!alive) return;
                    ps.sort((a, b) => (a.date === b.date ? (a.createdAt < b.createdAt ? -1 : 1) : (a.date < b.date ? -1 : 1)));
                    setPhotos(ps);
                }).catch(e => console.error(e)).finally(() => alive && setLoading(false));
                return () => { alive = false; };
            }, [customer && customer.id, photosVersion]);

            const filtered = photos.filter(p => filterView === 'all' || p.viewMode === filterView);
            const byDate = useMemo(() => {
                const map = {};
                filtered.forEach(p => { (map[p.date] = map[p.date] || []).push(p); });
                return Object.entries(map).sort((a, b) => a[0] < b[0] ? 1 : -1); // 新しい日付順
            }, [filtered]);

            const measurements = customer ? (customer.measurements || []) : [];

            if (!customer) {
                return <EmptyState icon="🗂" title="お客様を選択してください" message="ホームでお客様を選択すると、保存した写真・記録が表示されます。" />;
            }

            // ---- 比較画像の生成 ----
            const makeComparison = async (beforeP, afterP) => {
                const [bImg, aImg] = await Promise.all([
                    postureComposeImage(beforeP.image, beforeP.landmarks, beforeP.analysis, beforeP.viewMode, true),
                    postureComposeImage(afterP.image, afterP.landmarks, afterP.analysis, afterP.viewMode, true),
                ]);
                const dataUrl = await postureCreateComparisonImage(bImg, aImg, {
                    viewLabel: viewLabelOf(beforeP.viewMode) + (beforeP.viewMode !== afterP.viewMode ? '×' + viewLabelOf(afterP.viewMode) : ''),
                    customerName: customer.name,
                    beforeDate: beforeP.date, afterDate: afterP.date,
                    beforeScore: beforeP.totalScore, afterScore: afterP.totalScore,
                });
                return dataUrl;
            };

            const toggleCompareSel = async (p) => {
                hapticTap();
                if (compareSel.includes(p.id)) { setCompareSel(compareSel.filter(id => id !== p.id)); return; }
                const next = [...compareSel, p.id].slice(-2);
                setCompareSel(next);
                if (next.length === 2) {
                    const p1 = photos.find(x => x.id === next[0]);
                    const p2 = photos.find(x => x.id === next[1]);
                    if (!p1 || !p2) return;
                    // 日付順にBefore/After自動判定
                    const [bP, aP] = (p1.date + (p1.createdAt || '')) <= (p2.date + (p2.createdAt || '')) ? [p1, p2] : [p2, p1];
                    setShareBusy(true);
                    try {
                        const dataUrl = await makeComparison(bP, aP);
                        setComparePreview({ dataUrl, before: bP, after: aP });
                    } catch (e) {
                        console.error(e);
                        showToast('比較画像の生成に失敗しました', 'error');
                        setCompareSel([]);
                    } finally { setShareBusy(false); }
                }
            };

            const compareText = (bP, aP) => {
                const diff = (bP.totalScore != null && aP.totalScore != null) ? aP.totalScore - bP.totalScore : null;
                return [
                    `【Dear美容整体】${customer.name}様　姿勢ビフォーアフター（${viewLabelOf(bP.viewMode)}）`,
                    `Before ${fmtDateShort(bP.date)}${bP.totalScore != null ? `：${bP.totalScore}点` : ''}`,
                    `After  ${fmtDateShort(aP.date)}${aP.totalScore != null ? `：${aP.totalScore}点` : ''}`,
                    diff != null ? (diff >= 0 ? `スコア +${diff}点 改善しました🌸` : `スコア ${diff}点`) : '',
                ].filter(Boolean).join('\n');
            };

            const shareComparisonToLine = async (preview) => {
                if (shareBusy) return;
                setShareBusy(true);
                try {
                    const { dataUrl, before, after } = preview;
                    const fileName = `Dear_BeforeAfter_${customer.name.replace(/\s+/g, '_')}_${after.date.replace(/-/g, '')}.jpg`;
                    const text = compareText(before, after);
                    // 1) 設定済みバックエンドがあればPOST
                    if (settings.lineEndpoint) {
                        try {
                            const flex = buildComparisonFlexMessage({
                                customerName: customer.name, visitDate: after.date, staffName: settings.staffName,
                                pairs: [{ viewMode: before.viewMode, before: { analysis: before.analysis }, after: { analysis: after.analysis } }],
                                imageUrls: {},
                            });
                            const resp = await fetch(settings.lineEndpoint, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ type: 'beforeAfter', customerName: customer.name, text, images: [dataUrl], flex }),
                            });
                            if (!resp.ok) throw new Error('API ' + resp.status);
                            showToast('LINE連携APIへ送信しました', 'success');
                            hapticSuccess();
                            return;
                        } catch (e) {
                            console.warn('LINE API送信失敗 → 共有シートへフォールバック:', e);
                            showToast('API送信に失敗。共有シートを開きます', 'warning');
                        }
                    }
                    // 2) Web Share（モバイル: 共有先でLINEを選択）
                    const shared = await tryShareFiles([dataUrlToFile(dataUrl, fileName)], text);
                    if (shared === 'abort') return;
                    if (shared) { hapticSuccess(); return; }
                    // 3) フォールバック: 画像DL + LINEテキスト共有リンク
                    downloadDataUrl(dataUrl, fileName);
                    try { await navigator.clipboard.writeText(text); } catch (_) {}
                    window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
                    showToast('画像を保存しました。LINEで画像を添付して送信してください', 'info', 5000);
                } catch (e) {
                    console.error(e);
                    showToast('LINE共有に失敗しました', 'error');
                } finally { setShareBusy(false); }
            };

            // ---- 本日のセッション比較（カメラで撮ったBefore/Afterペア） ----
            const sessionPairs = ['front', 'back', 'side'].filter(v => compData['before_' + v] && compData['after_' + v]);

            const shareSessionPairs = async () => {
                if (sessionPairs.length === 0 || shareBusy) return;
                setShareBusy(true);
                try {
                    const files = [];
                    let text = `【Dear美容整体】${customer.name}様　本日の姿勢ビフォーアフター\n`;
                    for (const v of sessionPairs) {
                        const b = compData['before_' + v], a = compData['after_' + v];
                        const [bImg, aImg] = await Promise.all([
                            postureComposeImage(b.image, b.landmarks, b.analysis, v, true),
                            postureComposeImage(a.image, a.landmarks, a.analysis, v, true),
                        ]);
                        const bT = postureGetTotal(b.analysis), aT = postureGetTotal(a.analysis);
                        const dataUrl = await postureCreateComparisonImage(bImg, aImg, {
                            viewLabel: viewLabelOf(v), customerName: customer.name,
                            beforeDate: todayLocalYMD(), afterDate: todayLocalYMD(),
                            beforeScore: bT, afterScore: aT,
                        });
                        files.push(dataUrlToFile(dataUrl, `Dear_BeforeAfter_${viewLabelOf(v)}.jpg`));
                        if (bT != null && aT != null) text += `${viewLabelOf(v)}: ${bT}点 → ${aT}点（${aT - bT >= 0 ? '+' : ''}${aT - bT}）\n`;
                    }
                    const shared = await tryShareFiles(files, text);
                    if (shared === 'abort') return;
                    if (shared) { hapticSuccess(); return; }
                    files.forEach((f, i) => {
                        const reader = new FileReader();
                        reader.onload = () => downloadDataUrl(reader.result, f.name);
                        reader.readAsDataURL(f);
                    });
                    try { await navigator.clipboard.writeText(text); } catch (_) {}
                    window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
                    showToast('画像を保存しました。LINEで画像を添付して送信してください', 'info', 5000);
                } catch (e) {
                    console.error(e);
                    showToast('共有に失敗しました', 'error');
                } finally { setShareBusy(false); }
            };

            // ---- PDF出力 ----
            const togglePdfSel = (id) => {
                hapticTap();
                setPdfSel(sel => sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id]);
            };
            const autoSelectRecent9 = () => {
                const ids = [...photos].sort((a, b) => (a.date + (a.createdAt || '')) < (b.date + (b.createdAt || '')) ? 1 : -1).slice(0, 9).map(p => p.id);
                setPdfSel(ids);
            };
            const exportPdf = async () => {
                if (pdfBusy) return;
                const sel = pdfSel.map(id => photos.find(p => p.id === id)).filter(Boolean)
                    .sort((a, b) => (a.date + (a.createdAt || '')) < (b.date + (b.createdAt || '')) ? -1 : 1);
                if (sel.length === 0 && !(pdfIncludeMeasure && measurements.length)) {
                    showToast('写真を選択してください', 'warning'); return;
                }
                setPdfBusy(true);
                try {
                    try { await document.fonts.ready; } catch (_) {}
                    const pages = [];
                    const photoPageCount = Math.ceil(sel.length / 9);
                    const totalPages = photoPageCount + ((pdfIncludeMeasure && measurements.length) ? 1 : 0);
                    for (let pg = 0; pg < photoPageCount; pg++) {
                        const pagePhotos = sel.slice(pg * 9, pg * 9 + 9);
                        const composed = [];
                        for (const p of pagePhotos) {
                            let img = p.image;
                            try { img = await postureComposeImage(p.image, p.landmarks, p.analysis, p.viewMode, false); } catch (_) {}
                            composed.push({ ...p, image: img });
                        }
                        const dataUrl = await renderPhotoGridPage(composed, {
                            customerName: customer.name, pageNum: pg + 1, pageTotal: totalPages,
                        });
                        pages.push({ dataUrl, wPx: PDF_W, hPx: PDF_H });
                    }
                    if (pdfIncludeMeasure && measurements.length) {
                        const dataUrl = renderMeasurementPage(measurements, {
                            customerName: customer.name, pageNum: totalPages, pageTotal: totalPages,
                        });
                        pages.push({ dataUrl, wPx: PDF_W, hPx: PDF_H });
                    }
                    const blob = buildPdfFromJpegPages(pages);
                    const fileName = `Dear姿勢レポート_${customer.name.replace(/\s+/g, '_')}_${todayLocalYMD().replace(/-/g, '')}.pdf`;
                    const pdfFile = new File([blob], fileName, { type: 'application/pdf' });
                    const shared = await tryShareFiles([pdfFile], fileName);
                    if (shared === 'abort') { setPdfBusy(false); return; }
                    if (!shared) {
                        downloadBlob(blob, fileName);
                        showToast('PDFをダウンロードしました', 'success');
                    } else hapticSuccess();
                    setPdfModalOpen(false);
                } catch (e) {
                    console.error(e);
                    showToast('PDF生成に失敗しました: ' + (e.message || e), 'error');
                } finally { setPdfBusy(false); }
            };

            const deletePhoto = async (p) => {
                await idbDeletePhoto(p.id);
                setPhotos(ps => ps.filter(x => x.id !== p.id));
                setViewer(null);
                showToast('写真を削除しました', 'info');
            };

            const PhaseTag = ({ phase }) => (
                <span className="text-[8px] font-bold px-1.5 py-0.5 rounded-full text-white" style={{ background: phase === 'after' ? '#E8837E' : '#904C63' }}>
                    {phase === 'after' ? 'AFTER' : 'BEFORE'}
                </span>

            return (
                <div className="space-y-4">
                    <div className="dear-hero rounded-3xl p-5 border border-dear-100 shadow-sm flex items-center gap-3">
                        <LogoMark size={46} radius={14} />
                        <div className="flex-1 min-w-0">
                            <div className="font-mincho font-bold text-plum-700">記録・レポート</div>
                            <div className="text-[10px] text-plum-300 mt-0.5 truncate">{customer.name} 様　—　写真 {photos.length}枚 / 採寸 {measurements.length}回</div>
                        </div>
                    </div>

                    {/* アクション */}
                    <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => { setPdfModalOpen(true); if (pdfSel.length === 0) autoSelectRecent9(); }}
