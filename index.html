                            style={{ background: 'linear-gradient(135deg,#904C63,#663347)' }}>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            PDF出力（9枚つらなり）
                        </button>
                        <button onClick={() => { setCompareMode(!compareMode); setCompareSel([]); }}
                            className={`py-3 rounded-2xl text-sm font-bold shadow-md flex items-center justify-center gap-2 border-2 transition ${compareMode ? 'text-white' : 'bg-white'}`}
                            style={compareMode ? { background: '#E8837E', borderColor: '#E8837E' } : { color: '#C94D4D', borderColor: '#F2BBB6' }}>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="9" height="18" rx="2"/><rect x="13" y="3" width="9" height="18" rx="2"/></svg>
                            {compareMode ? '写真を2枚選択…' : 'ビフォーアフター作成'}

                    </div>

                    {/* 本日のセッションペア */}
                    {sessionPairs.length > 0 && (
                        <div className="dear-card p-4">
                            <SectionTitle icon="🌸" right={
                                <button onClick={shareSessionPairs} disabled={shareBusy}
                                    className="px-3 py-1.5 rounded-lg text-[11px] font-bold text-white flex items-center gap-1"
                                    style={{ background: '#06C755' }}>
                                    {shareBusy ? '生成中…' : 'まとめてLINEへ'}
                                </button>
                            }>本日の Before / After（{sessionPairs.length}方向）</SectionTitle>
                            <div className="flex gap-2">
                                {sessionPairs.map(v => {
                                    const bT = postureGetTotal(compData['before_' + v].analysis);
                                    const aT = postureGetTotal(compData['after_' + v].analysis);
                                    const d = (bT != null && aT != null) ? aT - bT : null;
                                    return (
                                        <div key={v} className="flex-1 rounded-xl p-2.5 text-center border" style={{ background: '#FDF6F5', borderColor: '#F3DFDC' }}>
                                            <div className="text-[10px] font-bold text-plum-400">{viewLabelOf(v)}</div>
                                            <div className="text-sm font-bold text-plum-700 mt-0.5">{bT ?? '–'} → {aT ?? '–'}</div>
                                            {d != null && <div className="text-[10px] font-bold" style={{ color: d >= 0 ? '#2F9C7C' : '#D34A6A' }}>{d >= 0 ? '+' : ''}{d}点</div>}

                    <div className="flex gap-1 p-1 rounded-2xl bg-white border border-dear-100 shadow-sm">

                            <button key={f.k} onClick={() => setFilterView(f.k)}
                                className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${filterView === f.k ? 'text-white shadow' : 'text-plum-300'}`}

                    </div>

                    {compareMode && (

                    {/* ギャラリー */}
                    {loading ? (

                                    </div>
                                    <div className="grid grid-cols-4 sm:grid-cols-6 gap-2">
                                        {ps.map(p => {

                                                <button key={p.id} onClick={() => compareMode ? toggleCompareSel(p) : setViewer(p)}
                                                    className="relative rounded-xl overflow-hidden active:scale-[0.97] transition"
                                                    style={{ aspectRatio: '9/16', border: sel ? '3px solid #E8837E' : '1px solid #F3DFDC' }}>
                                                    <img src={p.thumb || p.image} alt="" loading="lazy" className="w-full h-full object-cover" />
                                                    <div className="absolute top-1 left-1"><PhaseTag phase={p.phase} /></div>
                                                    <div className="absolute bottom-0 inset-x-0 flex items-center justify-between px-1.5 py-1" style={{ background: 'linear-gradient(transparent, rgba(62,31,44,0.85))' }}>
                                                        <span className="text-[8px] font-bold text-white">{viewLabelOf(p.viewMode)}</span>
                                                        {p.totalScore != null && <span className="text-[9px] font-bold" style={{ color: postureScoreColor(p.totalScore) }}>{p.totalScore}</span>}
                                                    </div>
                                                    {sel && (
                                                        <div className="absolute inset-0 flex items-center justify-center" style={{ background: 'rgba(232,131,126,0.3)' }}>
                                                            <div className="w-7 h-7 rounded-full bg-white flex items-center justify-center text-sm font-bold" style={{ color: '#C94D4D' }}>
                                                                {compareSel.indexOf(p.id) + 1}
                                                            </div>
                                                        </div>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 写真ビューア */}
                    {viewer && (
                        <Modal onClose={() => setViewer(null)} maxW="max-w-lg">
                            <ModalHeader title={`${fmtDateJP(viewer.date)}　${viewLabelOf(viewer.viewMode)}`}
                                subtitle={`${viewer.phase === 'after' ? 'After' : 'Before'}${viewer.totalScore != null ? `　総合 ${viewer.totalScore}点` : ''}`}
                                onClose={() => setViewer(null)} />
                            <div className="overflow-y-auto">
                                <img src={viewer.image} alt="" className="w-full" />
                                {viewer.analysis && viewer.analysis.items && (
                                    <div className="p-4 space-y-1.5">
                                        {viewer.analysis.items.map(item => (
                                            <div key={item.key} className="flex items-center justify-between text-xs py-1" style={{ borderBottom: '1px solid #F9F2F5' }}>
                                                <span className="font-bold text-plum-600">{item.label}</span>
                                                <span className="text-plum-300">{item.detail}</span>
                                                <span className="font-bold min-w-[32px] text-right" style={{ color: postureScoreColor(item.score) }}>{item.score}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="p-4 flex gap-2" style={{ borderTop: '1px solid #F9F2F5' }}>
                                <button onClick={async () => {
                                    try {
                                        const composed = await postureComposeImage(viewer.image, viewer.landmarks, viewer.analysis, viewer.viewMode, true);
                                        const fn = `Dear_${customer.name.replace(/\s+/g, '_')}_${viewer.date.replace(/-/g, '')}_${viewLabelOf(viewer.viewMode)}.jpg`;
                                        const shared = await tryShareFiles([dataUrlToFile(composed, fn)], fn);
                                        if (shared === 'abort') return;
                                        if (!shared) { downloadDataUrl(composed, fn); showToast('画像を保存しました', 'success'); }
                                    } catch (e) { showToast('保存に失敗しました', 'error'); }
                                }} className="flex-1 py-2.5 rounded-xl text-sm font-bold text-white" style={{ background: '#904C63' }}>端末に保存</button>
                                <button onClick={() => deletePhoto(viewer)} className="px-4 py-2.5 rounded-xl text-sm font-bold" style={{ background: '#FAE3E9', color: '#D34A6A' }}>削除</button>
                            </div>
                        </Modal>
                    )}

                    {/* 比較プレビュー */}
                    {comparePreview && (
                        <Modal onClose={() => { setComparePreview(null); setCompareSel([]); setCompareMode(false); }} maxW="max-w-lg">
                            <ModalHeader title="ビフォーアフター比較" subtitle={`${fmtDateShort(comparePreview.before.date)} → ${fmtDateShort(comparePreview.after.date)}`}
                                onClose={() => { setComparePreview(null); setCompareSel([]); setCompareMode(false); }} />
                            <div className="overflow-y-auto p-4">
                                <img src={comparePreview.dataUrl} alt="" className="w-full rounded-xl shadow-md" />
                                {comparePreview.before.totalScore != null && comparePreview.after.totalScore != null && (
                                    <div className="flex items-center justify-center gap-4 mt-3">
                                        <div className="text-center">
                                            <div className="text-[10px] text-plum-300 font-bold">Before</div>
                                            <div className="text-xl font-bold" style={{ color: postureScoreColor(comparePreview.before.totalScore) }}>{comparePreview.before.totalScore}</div>
                                        </div>
                                        <div className="text-center px-3 py-1 rounded-xl" style={{ background: '#F9F2F5' }}>
                                            {(() => { const d = comparePreview.after.totalScore - comparePreview.before.totalScore; return (
                                                <div className="text-lg font-bold" style={{ color: d >= 0 ? '#2F9C7C' : '#D34A6A' }}>{d >= 0 ? '+' : ''}{d}<span className="text-[10px]">点</span></div>
                                            ); })()}
                                        </div>
                                        <div className="text-center">
                                            <div className="text-[10px] text-plum-300 font-bold">After</div>
                                            <div className="text-xl font-bold" style={{ color: postureScoreColor(comparePreview.after.totalScore) }}>{comparePreview.after.totalScore}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="p-4 flex gap-2" style={{ borderTop: '1px solid #F9F2F5' }}>
                                <button onClick={() => {
                                    const fn = `Dear_BeforeAfter_${customer.name.replace(/\s+/g, '_')}_${comparePreview.after.date.replace(/-/g, '')}.jpg`;
                                    downloadDataUrl(comparePreview.dataUrl, fn);
                                    showToast('画像を保存しました', 'success');
                                }} className="py-2.5 px-4 rounded-xl text-sm font-bold text-white" style={{ background: '#904C63' }}>保存</button>
                                <button onClick={() => shareComparisonToLine(comparePreview)} disabled={shareBusy}
                                    className="flex-1 py-2.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2" style={{ background: '#06C755' }}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
                                    {shareBusy ? '送信中…' : 'LINEで送る'}
                                </button>
                            </div>
                        </Modal>
                    )}

                    {/* PDF出力モーダル */}
                    {pdfModalOpen && (
                        <Modal onClose={() => !pdfBusy && setPdfModalOpen(false)} maxW="max-w-lg">
                            <ModalHeader title="PDFレポート出力" subtitle="9枚つらなりレイアウト（A4）" onClose={() => !pdfBusy && setPdfModalOpen(false)} />
                            <div className="overflow-y-auto p-4 space-y-3">
                                <div className="flex items-center justify-between">
                                    <div className="text-xs font-bold text-plum-600">
                                        写真を選択　<span className="px-2 py-0.5 rounded-full text-[10px]" style={{ background: '#F1E2E9', color: '#904C63' }}>{pdfSel.length}枚選択中</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={autoSelectRecent9} className="text-[10px] font-bold text-dear-600 underline">最新9枚</button>
                                        <button onClick={() => setPdfSel([])} className="text-[10px] font-bold text-plum-300 underline">解除</button>
                                    </div>
                                </div>
                                <div className="text-[10px] text-plum-300 leading-relaxed">
                                    1ページに9枚（3×3）を日付順に並べます。9枚を超えた分は自動で次ページに続きます。
                                </div>
                                {photos.length === 0 ? (
                                    <EmptyState icon="📷" title="写真がありません" compact />
                                ) : (
                                    <div className="grid grid-cols-4 gap-2">
                                        {[...photos].sort((a, b) => (a.date + (a.createdAt || '')) < (b.date + (b.createdAt || '')) ? 1 : -1).map(p => {
                                            const sel = pdfSel.includes(p.id);
                                            const order = pdfSel.indexOf(p.id);
                                            return (
                                                <button key={p.id} onClick={() => togglePdfSel(p.id)}
                                                    className="relative rounded-lg overflow-hidden active:scale-[0.97] transition"
                                                    style={{ aspectRatio: '9/16', border: sel ? '3px solid #904C63' : '1px solid #F3DFDC' }}>
                                                    <img src={p.thumb || p.image} alt="" loading="lazy" className="w-full h-full object-cover" />
                                                    <div className="absolute bottom-0 inset-x-0 px-1 py-0.5 text-center" style={{ background: 'rgba(62,31,44,0.8)' }}>
                                                        <span className="text-[7px] font-bold text-white">{fmtDateShort(p.date)} {viewLabelOf(p.viewMode)}</span>
                                                    </div>
                                                    {sel && (
                                                        <div className="absolute top-1 right-1 w-5 h-5 rounded-full text-white text-[10px] font-bold flex items-center justify-center" style={{ background: '#904C63' }}>
                                                            {order + 1}
                                                        </div>

                                        })}

                                {measurements.length > 0 && (

                            </div>
                            <div className="p-4" style={{ borderTop: '1px solid #F9F2F5' }}>
                                <button onClick={exportPdf} disabled={pdfBusy}
                                    className="w-full py-3 rounded-xl text-white font-bold text-sm shadow-md flex items-center justify-center gap-2"

                                    {pdfBusy ? (
                                        <React.Fragment>
                                            <div className="w-4 h-4 rounded-full animate-spin" style={{ border: '2px solid rgba(255,255,255,0.3)', borderTopColor: '#fff' }} />

                                        </React.Fragment>

        // ============================================================
        // 設定ビュー
        // ============================================================
        const SettingsView = ({ settings, setSettings, customers, setCustomers }) => {
            const [local, setLocal] = useState(settings);
            const fileRef = useRef(null);
            const save = () => {
                setSettings(local);
                persistSettings(local);
                showToast('設定を保存しました', 'success');
            };
            const exportData = () => {
                const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), customers }, null, 2)], { type: 'application/json' });
                downloadBlob(blob, `Dear_backup_${todayLocalYMD().replace(/-/g, '')}.json`);
                showToast('カルテデータを書き出しました（写真は含まれません）', 'success', 4500);
            };
            const importData = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (!Array.isArray(data.customers)) throw new Error('形式が不正です');
                        setCustomers(data.customers);
                        persistCustomers(data.customers);
                        showToast(`${data.customers.length}名のカルテを読み込みました`, 'success');
                    } catch (err) {
                        showToast('読み込みに失敗しました: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };
            return (
                <div className="space-y-4">
                    <div className="dear-hero rounded-3xl p-5 border border-dear-100 shadow-sm flex items-center gap-3">
                        <LogoMark size={46} radius={14} />
                        <div>
                            <div className="font-mincho font-bold text-plum-700">設定</div>
                            <div className="text-[10px] text-plum-300 mt-0.5">店舗情報・LINE連携・データ管理</div>
                        </div>
                    </div>
                    <div className="dear-card p-4 space-y-3">
                        <SectionTitle icon="🏪">店舗情報</SectionTitle>
                        <Field label="店舗名">
                            <TextInput value={local.storeName} onChange={e => setLocal({ ...local, storeName: e.target.value })} />
                        </Field>
                        <Field label="担当スタッフ名（レポートに記載）">
                            <TextInput value={local.staffName} onChange={e => setLocal({ ...local, staffName: e.target.value })} placeholder="田中" />
                        </Field>
                    </div>
                    <div className="dear-card p-4 space-y-3">
                        <SectionTitle icon="💬">LINE連携</SectionTitle>
                        <div className="text-[11px] text-plum-400 leading-relaxed">
                            <b>基本の使い方（設定不要）:</b> 比較画像の「LINEで送る」ボタンから端末の共有シートが開き、LINEを選んでお客様に送信できます。<br /><br />
                            <b>API連携（任意）:</b> LINE Messaging API のバックエンド（GAS・サーバー等）をお持ちの場合、下にURLを設定すると比較画像とFlexメッセージをJSONでPOSTします。
                        </div>
                        <Field label="送信先エンドポイントURL（任意）">
                            <TextInput value={local.lineEndpoint} onChange={e => setLocal({ ...local, lineEndpoint: e.target.value })} placeholder="https://script.google.com/macros/s/…/exec" />
                        </Field>
                        <div className="text-[10px] text-plum-200 leading-relaxed">
                            POST内容: {'{ type, customerName, text, images: [dataURL], flex }'}
                        </div>
                    </div>
                    <button onClick={save} className="w-full py-3 rounded-2xl text-white font-bold text-sm shadow-md"
                        style={{ background: 'linear-gradient(135deg,#904C63,#663347)' }}>設定を保存</button>

                    <div className="dear-card p-4 space-y-3">
                        <SectionTitle icon="💾">データ管理</SectionTitle>
                        <div className="text-[11px] text-plum-400 leading-relaxed">
                            カルテ（顧客・来店・カウンセリング・採寸）はこの端末のブラウザ内に保存されています。
                            端末の変更やブラウザデータ削除に備えて、定期的なバックアップをおすすめします。
                            ※写真データはサイズが大きいためバックアップに含まれません。PDF出力や端末保存をご利用ください。
                        </div>
                        <div className="flex gap-2">
                            <button onClick={exportData} className="flex-1 py-2.5 rounded-xl text-sm font-bold text-white" style={{ background: '#A99560' }}>
                                カルテを書き出し
                            </button>
                            <button onClick={() => fileRef.current && fileRef.current.click()} className="flex-1 py-2.5 rounded-xl text-sm font-bold border-2 bg-white" style={{ borderColor: '#E5DCBC', color: '#8C7A4C' }}>
                                読み込み
                            </button>
                            <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={importData} />
                        </div>
                    </div>

                    <div className="text-center text-[10px] text-plum-200 pb-2 leading-relaxed">
                        Dear美容整体 姿勢分析ツール<br />骨盤矯正・小顔矯正　—　MediaPipe Pose AI姿勢解析
                    </div>
                </div>
            );
        };

        // ============================================================
        // アプリ本体（タブナビゲーション）
        // ============================================================
        const App = () => {
            const [customers, setCustomers] = useState(loadCustomers);
            const [selectedId, setSelectedId] = useState(null);
            const [tab, setTab] = useState('home');
            const [counselingOpen, setCounselingOpen] = useState(false);
            const [settings, setSettings] = useState(loadSettings);
            const [photosVersion, setPhotosVersion] = useState(0);
            const [photoCount, setPhotoCount] = useState(0);
            // 撮影セッションの比較スロット（タブ切替しても保持）
            const [compData, setCompData] = useState({ before_front: null, before_back: null, before_side: null, after_front: null, after_back: null, after_side: null });

            const customer = customers.find(c => c.id === selectedId) || null;

            useEffect(() => { persistCustomers(customers); }, [customers]);

            useEffect(() => {
                let alive = true;
                if (!customer) { setPhotoCount(0); return; }
                idbCountByCustomer(customer.id).then(n => alive && setPhotoCount(n)).catch(() => {});
                return () => { alive = false; };
            }, [customer && customer.id, photosVersion]);

            const updateCustomer = useCallback((id, updater) => {
                setCustomers(cs => cs.map(c => c.id === id ? updater(c) : c));
            }, []);

            const createCustomer = ({ name, furigana }) => {
                const c = { id: uid(), name, furigana, createdAt: new Date().toISOString(), visits: [], measurements: [], counseling: null };
                setCustomers(cs => [...cs, c]);
                setSelectedId(c.id);
                showToast(`${name} 様を登録しました`, 'success');
            };

            const deleteCustomer = async (id) => {
                try {
                    const ps = await idbGetPhotosByCustomer(id);
                    for (const p of ps) await idbDeletePhoto(p.id);
                } catch (e) { console.warn(e); }
                setCustomers(cs => cs.filter(c => c.id !== id));
                if (selectedId === id) setSelectedId(null);
                // セッション比較もクリア
                setCompData({ before_front: null, before_back: null, before_side: null, after_front: null, after_back: null, after_side: null });
                showToast('カルテを削除しました', 'info');
            };

            const selectCustomer = (id) => {
                if (id !== selectedId) {
                    setCompData({ before_front: null, before_back: null, before_side: null, after_front: null, after_back: null, after_side: null });
                }
                setSelectedId(id);
            };

            const activeVisitN = useMemo(() => {
                if (!customer) return null;
                const today = todayLocalYMD();
                const tv = (customer.visits || []).find(v => v.date === today);
                return tv ? tv.n : (customer.visits || []).length + 1;
            }, [customer]);

            const gotoTab = (t) => { hapticTap(); setTab(t); window.scrollTo({ top: 0 }); };

            const TABS = [
                { key: 'home', label: 'ホーム', icon: (on) => (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={on ? 2.5 : 2} strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                ) },
                { key: 'camera', label: '撮影分析', icon: (on) => (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={on ? 2.5 : 2} strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                ) },
                { key: 'measure', label: '採寸', icon: (on) => (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={on ? 2.5 : 2} strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h20"/><path d="M6 8v8"/><path d="M10 6v12"/><path d="M14 8v8"/><path d="M18 6v12"/></svg>
                ) },
                { key: 'records', label: '記録', icon: (on) => (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={on ? 2.5 : 2} strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                ) },
                { key: 'settings', label: '設定', icon: (on) => (
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={on ? 2.5 : 2} strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                ) },
            ];

            return (
                <div className="min-h-screen" style={{ background: '#FDF6F5' }}>
                    {/* トップバー */}
                    <header className="sticky top-0 z-40 bg-white/90 border-b border-dear-100" style={{ backdropFilter: 'blur(10px)' }}>
                        <div className="max-w-xl md:max-w-2xl lg:max-w-3xl mx-auto px-4 py-2.5 flex items-center gap-3">
                            <LogoMark size={36} radius={11} />
                            <div className="flex-1 min-w-0">
                                <div className="font-mincho font-bold text-[15px] text-plum-700 leading-tight">{settings.storeName || 'Dear美容整体'}</div>
                                <div className="text-[9px] text-gold-600 font-bold tracking-[0.18em]">骨盤矯正　小顔矯正</div>
                            </div>
                            {customer ? (
                                <button onClick={() => gotoTab('home')}
                                    className="flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-full border max-w-[45%]"
                                    style={{ background: '#F9F2F5', borderColor: '#DFC0CD' }}>
                                    <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0"
                                        style={{ background: 'linear-gradient(135deg,#E8837E,#904C63)' }}>
                                        {(customer.name || '?').trim()[0]}
                                    </div>
                                    <span className="text-xs font-bold text-plum-600 truncate">{customer.name} 様</span>
                                </button>
                            ) : (
                                <button onClick={() => gotoTab('home')} className="text-[10px] font-bold px-3 py-2 rounded-full" style={{ background: '#FBEAE8', color: '#C94D4D' }}>
                                    お客様を選択
                                </button>
                            )}
                        </div>
                    </header>

                    {/* コンテンツ */}
                    <main className="max-w-xl md:max-w-2xl lg:max-w-3xl mx-auto px-4 pt-4 pb-28">
                        {tab === 'home' && (
                            customer ? (
                                <CustomerDetailView
                                    customer={customer}
                                    updateCustomer={updateCustomer}
                                    onBack={() => setSelectedId(null)}
                                    onDelete={deleteCustomer}
                                    gotoTab={gotoTab}
                                    openCounseling={() => setCounselingOpen(true)}
                                    photoCount={photoCount}
                                />
                            ) : (
                                <CustomerListView customers={customers} onSelect={selectCustomer} onCreate={createCustomer} />
                            )
                        )}
                        {tab === 'camera' && (
                            <CameraView
                                customer={customer}
                                compData={compData}
                                setCompData={setCompData}
                                settings={settings}
                                onPhotoSaved={() => setPhotosVersion(v => v + 1)}
                                activeVisitN={activeVisitN}
                            />
                        )}
                        {tab === 'measure' && (
                            <MeasurementView customer={customer} updateCustomer={updateCustomer} gotoTab={gotoTab} />
                        )}
                        {tab === 'records' && (
                            <RecordsView customer={customer} photosVersion={photosVersion} compData={compData} settings={settings} gotoTab={gotoTab} />
                        )}
                        {tab === 'settings' && (
                            <SettingsView settings={settings} setSettings={setSettings} customers={customers} setCustomers={setCustomers} />
                        )}
                    </main>

                    {/* ボトムナビ */}
                    <nav className="fixed bottom-0 inset-x-0 z-40 bg-white/95 border-t border-dear-100" style={{ backdropFilter: 'blur(12px)', paddingBottom: 'env(safe-area-inset-bottom)' }}>
                        <div className="max-w-xl md:max-w-2xl lg:max-w-3xl mx-auto flex">
                            {TABS.map(t => {
                                const on = tab === t.key;
                                return (
                                    <button key={t.key} onClick={() => gotoTab(t.key)}
                                        className="flex-1 flex flex-col items-center gap-0.5 pt-2.5 pb-2 transition"
                                        style={{ color: on ? '#C94D4D' : '#C9AEB6' }}>
                                        {t.icon(on)}
                                        <span className="text-[9px] font-bold">{t.label}</span>
                                        <span className="w-1 h-1 rounded-full" style={{ background: on ? '#C94D4D' : 'transparent' }} />
                                    </button>
                                );
                            })}
                        </div>
                    </nav>

                    {/* カウンセリングフォーム */}
                    {counselingOpen && customer && (
                        <CounselingForm customer={customer} updateCustomer={updateCustomer} onClose={() => setCounselingOpen(false)} storeName={settings.storeName} />
                    )}
                </div>
            );
        };

        // ============================================================
        // マウント
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
