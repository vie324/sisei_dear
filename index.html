                <text x="50" y="68" textAnchor="middle" dominantBaseline="central" style={{ fontSize: 11, fontWeight: 500, fill: postureScoreColor(score) }}>{postureScoreLabel(score)}</text>
            </svg>
        );

        const EmptyState = ({ icon = '📭', title, message, compact = false }) => (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: compact ? '24px 16px' : '44px 20px', textAlign: 'center' }}>
                <div style={{ fontSize: 38, marginBottom: 8 }}>{icon}</div>
                <div style={{ fontSize: compact ? 13 : 15, fontWeight: 700, color: '#6B4A56', marginBottom: 6 }}>{title}</div>
                {message && <div style={{ fontSize: 12, color: '#B08A96', maxWidth: 320, lineHeight: 1.6 }}>{message}</div>}
            </div>
        );

        // ============================================================
        // ホーム: 顧客一覧 / 顧客詳細（来店フローガイド）
        // ============================================================
        const CustomerListView = ({ customers, onSelect, onCreate }) => {
            const [query, setQuery] = useState('');
            const [showNew, setShowNew] = useState(false);
            const [newName, setNewName] = useState('');
            const [newKana, setNewKana] = useState('');
            const filtered = customers.filter(c =>
                !query || (c.name || '').includes(query) || (c.furigana || '').includes(query));

            return (
                <div className="space-y-4">
                    {/* ヒーローカード */}
                    <div className="dear-hero rounded-3xl p-6 border border-dear-100 shadow-sm relative overflow-hidden">
                        <div className="flex items-center gap-4 relative z-10">
                            <LogoMark size={72} radius={20} />
                            <div>
                                <div className="font-mincho font-bold text-xl text-plum-600 leading-snug">Dear美容整体</div>
                                <div className="text-[11px] text-gold-600 font-bold tracking-widest mt-0.5">骨盤矯正　小顔矯正</div>
                                <div className="text-[11px] text-plum-300 mt-1.5">姿勢分析・ボディ記録ツール</div>
                            </div>
                        </div>
                    </div>

                    {/* 検索 + 新規 */}
                    <div className="flex gap-2">
                        <div className="flex-1 relative">
                            <svg className="absolute left-3 top-1/2 -translate-y-1/2" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C795AA" strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" value={query} onChange={e => setQuery(e.target.value)} placeholder="お客様を検索..."
                                className="w-full border rounded-xl pl-9 pr-3 py-2.5 text-sm" />
                        </div>
                        <button onClick={() => setShowNew(true)}
                            className="px-4 py-2.5 rounded-xl text-white text-sm font-bold shadow-md flex items-center gap-1.5"
                            style={{ background: 'linear-gradient(135deg,#E8837E,#C94D4D)' }}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            新規
                        </button>
                    </div>

                    {/* 顧客リスト */}
                    {filtered.length === 0 ? (
                        <div className="dear-card">
                            <EmptyState icon="🌸" title={customers.length === 0 ? 'お客様を登録しましょう' : '該当するお客様がいません'}
                                message={customers.length === 0 ? '「新規」ボタンから初回のお客様を登録すると、来店回数に合わせたご案内が表示されます。' : ''} />
                        </div>
                    ) : (
                        <div className="space-y-2">
                            {filtered.map(c => {
                                const visitCount = (c.visits || []).length;
                                const lastVisit = visitCount ? c.visits[visitCount - 1].date : null;
                                const lastMeasure = (c.measurements || []).length ? c.measurements[c.measurements.length - 1].date : null;
                                const needsRemeasure = visitCount >= 2 && (!lastMeasure || daysBetween(lastMeasure, todayLocalYMD()) >= 60);
                                return (
                                    <button key={c.id} onClick={() => { hapticTap(); onSelect(c.id); }}
                                        className="w-full dear-card p-4 flex items-center gap-3 text-left active:scale-[0.99] transition">
                                        <div className="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-base flex-shrink-0"
                                            style={{ background: 'linear-gradient(135deg,#E8837E,#904C63)' }}>
                                            {(c.name || '?').trim()[0]}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-sm text-plum-800 truncate">{c.name}</span>
                                                {c.furigana && <span className="text-[10px] text-plum-300 truncate">{c.furigana}</span>}
                                            </div>
                                            <div className="text-[11px] text-plum-300 mt-0.5">
                                                来店 {visitCount}回{lastVisit ? `　最終 ${fmtDateShort(lastVisit)}` : ''}
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end gap-1">
                                            {needsRemeasure && (
                                                <span className="text-[9px] font-bold px-2 py-0.5 rounded-full bg-dear-100 text-dear-700 whitespace-nowrap">📏 採寸時期</span>
                                            )}
                                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap"
                                                style={{ background: '#F1E2E9', color: '#904C63' }}>
                                                次回{visitCount + 1}回目
                                            </span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    )}

                    {/* 新規登録モーダル */}
                    {showNew && (
                        <Modal onClose={() => setShowNew(false)}>
                            <ModalHeader title="新規のお客様" subtitle="初回来店の受付" onClose={() => setShowNew(false)} />
                            <div className="p-5 space-y-4">
                                <Field label="お名前 *">
                                    <TextInput value={newName} onChange={e => setNewName(e.target.value)} placeholder="山田 花子" />
                                </Field>
                                <Field label="フリガナ">
                                    <TextInput value={newKana} onChange={e => setNewKana(e.target.value)} placeholder="ヤマダ ハナコ" />
                                </Field>
                                <button
                                    onClick={() => {
                                        if (!newName.trim()) { showToast('お名前を入力してください', 'warning'); return; }
                                        onCreate({ name: newName.trim(), furigana: newKana.trim() });
                                        setNewName(''); setNewKana(''); setShowNew(false);
                                    }}
                                    className="w-full py-3 rounded-xl text-white font-bold text-sm shadow-md"
                                    style={{ background: 'linear-gradient(135deg,#904C63,#663347)' }}>
                                    登録して選択する
                                </button>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        // 顧客詳細 + 本日の来店フロー
        const CustomerDetailView = ({ customer, updateCustomer, onBack, onDelete, gotoTab, openCounseling, photoCount }) => {
            const visits = customer.visits || [];
            const measurements = customer.measurements || [];
            const today = todayLocalYMD();
            const todayVisit = visits.find(v => v.date === today);
            const nextN = todayVisit ? todayVisit.n : visits.length + 1;
            const plan = visitPlanFor(nextN);
            const lastMeasure = measurements.length ? measurements[measurements.length - 1].date : null;
            const daysSinceMeasure = lastMeasure ? daysBetween(lastMeasure, today) : null;
            const needsRemeasure = nextN >= 3 && (!lastMeasure || daysSinceMeasure >= 60);
            const [confirmDelete, setConfirmDelete] = useState(false);
            const counselingDone = !!(customer.counseling && customer.counseling.savedAt);

            const startTodayVisit = () => {
                hapticSuccess();
                updateCustomer(customer.id, c => {
                    const vs = c.visits || [];
                    if (vs.find(v => v.date === today)) return c;
                    return { ...c, visits: [...vs, { id: uid(), n: vs.length + 1, date: today, menu: visitPlanFor(vs.length + 1).menu, memo: '', nextAppointment: '', tasksDone: {} }] };
                });
            };
            const updateTodayVisit = (patch) => {
                updateCustomer(customer.id, c => ({
                    ...c,
                    visits: (c.visits || []).map(v => v.date === today ? { ...v, ...patch } : v),
                }));
            };
            const toggleTask = (key) => {
                if (!todayVisit) return;
                hapticTap();
                updateTodayVisit({ tasksDone: { ...(todayVisit.tasksDone || {}), [key]: !(todayVisit.tasksDone || {})[key] } });
            };
            const removeTodayVisit = () => {
                updateCustomer(customer.id, c => ({ ...c, visits: (c.visits || []).filter(v => v.date !== today) }));
            };

            const taskAction = (key) => {
                if (key === 'counseling') openCounseling();
                else if (key === 'photoBefore') gotoTab('camera');
                else if (key === 'measurement') gotoTab('measure');
                else if (key === 'checkRemeasure') gotoTab('measure');
            };

            return (
                <div className="space-y-4">
                    {/* 顧客ヘッダー */}
                    <div className="dear-hero rounded-3xl p-5 border border-dear-100 shadow-sm">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="w-9 h-9 rounded-full bg-white border border-dear-200 flex items-center justify-center text-plum-400 flex-shrink-0">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                            </button>
                            <div className="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg flex-shrink-0"
                                style={{ background: 'linear-gradient(135deg,#E8837E,#904C63)' }}>
                                {(customer.name || '?').trim()[0]}
                            </div>
                            <div className="flex-1 min-w-0">
                                <div className="font-mincho font-bold text-lg text-plum-800 truncate">{customer.name} <span className="text-sm">様</span></div>
                                <div className="text-[11px] text-plum-300">
                                    {customer.furigana && customer.furigana + '　'}来店 {visits.length}回
                                    {customer.counseling?.basic?.birthdate && `　${calcAge(customer.counseling.basic.birthdate)}歳`}
                                </div>
                            </div>
                            <button onClick={() => setConfirmDelete(true)} className="text-[10px] text-plum-200 underline flex-shrink-0">削除</button>
                        </div>
                        <div className="flex gap-2 mt-4">
                            <div className="flex-1 bg-white/70 rounded-xl px-3 py-2 text-center border border-dear-100">
                                <div className="text-base font-bold text-plum-600">{visits.length}<span className="text-[10px] font-normal">回</span></div>
                                <div className="text-[9px] text-plum-300 font-bold">来店回数</div>
                            </div>
                            <div className="flex-1 bg-white/70 rounded-xl px-3 py-2 text-center border border-dear-100">
                                <div className="text-base font-bold text-plum-600">{photoCount}<span className="text-[10px] font-normal">枚</span></div>
                                <div className="text-[9px] text-plum-300 font-bold">記録写真</div>
                            </div>
                            <div className="flex-1 bg-white/70 rounded-xl px-3 py-2 text-center border border-dear-100">
                                <div className="text-base font-bold text-plum-600">{measurements.length}<span className="text-[10px] font-normal">回</span></div>
                                <div className="text-[9px] text-plum-300 font-bold">採寸</div>
                            </div>
                        </div>
                    </div>

                    {/* 採寸リマインド */}
                    {needsRemeasure && (
                        <div className="rounded-2xl p-4 border-2 border-dear-300 bg-dear-50 flex items-center gap-3">
                            <span className="text-2xl">📏</span>
                            <div className="flex-1">
                                <div className="text-sm font-bold text-dear-700">採寸・撮影の時期です</div>
                                <div className="text-[11px] text-plum-400 mt-0.5">
                                    {lastMeasure ? `前回の採寸から${daysSinceMeasure}日経過しています。` : 'まだ採寸記録がありません。'}
                                    2〜3ヶ月ペースの計測で変化を見える化しましょう。
                                </div>
                            </div>
                            <button onClick={() => gotoTab('measure')} className="px-3 py-2 rounded-xl text-white text-xs font-bold whitespace-nowrap"
                                style={{ background: '#C94D4D' }}>採寸へ</button>
                        </div>
                    )}

                    {/* 本日の来店フロー */}
                    <div className="dear-card p-4">
                        <SectionTitle icon="🌸" right={todayVisit && (
                            <button onClick={removeTodayVisit} className="text-[10px] text-plum-200 underline">取消</button>
                        )}>
                            本日の来店　—　{plan.title}
                        </SectionTitle>
                        {!todayVisit ? (
                            <div>
                                <div className="text-xs text-plum-400 leading-relaxed mb-3">
                                    {customer.name}様は次が<b className="text-plum-600">{nextN}回目</b>の来店です。
                                    {nextN === 1 && ' 初回はカウンセリング → 骨盤矯正 → 着衣のままビフォー撮影の流れです。'}
                                    {nextN === 2 && ' 2回目はコアレ → 水着に着替えて採寸 & 撮影の流れです。'}
                                    {nextN >= 3 && ' 月1〜2回の来店ペース、2〜3ヶ月ごとに採寸&撮影を行います。'}
                                </div>
                                <button onClick={startTodayVisit}
                                    className="w-full py-3 rounded-xl text-white font-bold text-sm shadow-md"
                                    style={{ background: 'linear-gradient(135deg,#E8837E,#C94D4D)' }}>
                                    本日の来店を開始する（{nextN}回目）
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-2">
                                {plan.tasks.map(t => {
                                    const done = (todayVisit.tasksDone || {})[t.key] ||
                                        (t.key === 'counseling' && counselingDone) ||
                                        (t.key === 'nextBooking' && !!todayVisit.nextAppointment) ||
                                        (t.key === 'measurement' && measurements.some(m => m.date === today));
                                    const hasAction = ['counseling', 'photoBefore', 'measurement', 'checkRemeasure'].includes(t.key);
                                    return (
                                        <div key={t.key} className={`flex items-center gap-3 p-3 rounded-xl border transition ${done ? 'bg-dear-50 border-dear-200' : 'bg-white border-plum-100'}`}>
                                            <button onClick={() => toggleTask(t.key)}
                                                className="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition"
                                                style={{ borderColor: done ? '#C94D4D' : '#DFC0CD', background: done ? '#C94D4D' : '#fff' }}>
                                                {done && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
                                            </button>
                                            <div className="flex-1 min-w-0">
                                                <div className={`text-xs font-bold ${done ? 'text-plum-300 line-through' : 'text-plum-800'}`}>{t.icon} {t.label}</div>
                                            </div>
                                            {hasAction && (
                                                <button onClick={() => taskAction(t.key)}
                                                    className="px-2.5 py-1.5 rounded-lg text-[10px] font-bold text-plum-500 bg-plum-50 border border-plum-100 whitespace-nowrap">
                                                    開く →
                                                </button>
                                            )}
                                        </div>
                                    );
                                })}
                                {/* メニュー・メモ・次回予約 */}
                                <div className="grid grid-cols-2 gap-2 pt-1">
                                    <Field label="本日の施術メニュー">
                                        <TextInput value={todayVisit.menu || ''} onChange={e => updateTodayVisit({ menu: e.target.value })} placeholder={plan.menu || '骨盤矯正 / コアレ'} />
                                    </Field>
                                    <Field label="次回予約日">
                                        <input type="date" value={todayVisit.nextAppointment || ''} min={today}
                                            onChange={e => updateTodayVisit({ nextAppointment: e.target.value })}
                                            className="w-full border rounded-lg px-2.5 py-2 text-sm" />
                                    </Field>
                                </div>
                                <Field label="メモ">
                                    <textarea value={todayVisit.memo || ''} onChange={e => updateTodayVisit({ memo: e.target.value })}
                                        rows="2" placeholder="お客様の様子・お身体の状態など" className="w-full border rounded-lg px-2.5 py-2 text-sm" />
                                </Field>
                                <div className="rounded-xl p-3 text-[10px] leading-relaxed" style={{ background: '#FAF8F0', color: '#8C7A4C', border: '1px solid #E5DCBC' }}>
                                    💡 {plan.afterNote}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* カウンセリング */}
                    <div className="dear-card p-4">
                        <SectionTitle icon="📋" right={
                            <button onClick={openCounseling} className="px-3 py-1.5 rounded-lg text-[11px] font-bold text-white"
                                style={{ background: counselingDone ? '#904C63' : '#C94D4D' }}>
                                {counselingDone ? '内容を見る・編集' : '入力する'}
                            </button>
                        }>カウンセリング（問診票）</SectionTitle>
                        {counselingDone ? (
                            <div className="text-[11px] text-plum-400 leading-relaxed">
                                ✅ {fmtDateJP((customer.counseling.savedAt || '').slice(0, 10))} 入力済み
                                {customer.counseling.trigger?.source && `　きっかけ: ${customer.counseling.trigger.source}`}
                                {(customer.counseling.goals || []).length > 0 && (
                                    <div className="mt-1.5 flex flex-wrap gap-1">
                                        {customer.counseling.goals.map(g => (
                                            <span key={g} className="px-2 py-0.5 rounded-full bg-plum-50 text-plum-500 text-[10px] font-bold">{g}</span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="text-[11px] text-plum-300">初回来店時に紙の問診票と同じ内容をデジタルで入力できます。</div>
                        )}
                    </div>

                    {/* 来店履歴 */}
                    <div className="dear-card p-4">
                        <SectionTitle icon="🗓">来店履歴</SectionTitle>
                        {visits.length === 0 ? (
                            <div className="text-[11px] text-plum-300">まだ来店記録がありません。</div>
                        ) : (
                            <div className="space-y-0">
                                {[...visits].reverse().map((v, i) => (
                                    <div key={v.id} className="flex items-start gap-3 py-2.5" style={{ borderBottom: i < visits.length - 1 ? '1px solid #F9F2F5' : 'none' }}>
                                        <div className="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold flex-shrink-0"
                                            style={{ background: '#F1E2E9', color: '#904C63' }}>{v.n}回</div>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-xs font-bold text-plum-800">{fmtDateJP(v.date)}　<span className="text-plum-400">{v.menu || '—'}</span></div>
                                            {v.memo && <div className="text-[10px] text-plum-300 mt-0.5">{v.memo}</div>}
                                            {v.nextAppointment && <div className="text-[10px] text-dear-600 mt-0.5">→ 次回予約 {fmtDateShort(v.nextAppointment)}</div>}
                                        </div>
                                        {measurements.some(m => m.date === v.date) && <span className="text-[9px] px-1.5 py-0.5 rounded bg-gold-100 text-gold-600 font-bold flex-shrink-0">採寸</span>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 削除確認 */}
                    {confirmDelete && (
                        <Modal onClose={() => setConfirmDelete(false)}>
                            <div className="p-6 space-y-4">
                                <div className="text-sm font-bold text-plum-800 text-center">{customer.name} 様のカルテを削除しますか？</div>
                                <div className="text-[11px] text-plum-300 text-center leading-relaxed">来店履歴・カウンセリング・採寸・保存写真がすべて削除されます。<br/>この操作は取り消せません。</div>
                                <div className="flex gap-2">
                                    <button onClick={() => setConfirmDelete(false)} className="flex-1 py-2.5 rounded-xl text-sm font-bold text-plum-400 bg-plum-50">キャンセル</button>
                                    <button onClick={() => { setConfirmDelete(false); onDelete(customer.id); }} className="flex-1 py-2.5 rounded-xl text-sm font-bold text-white" style={{ background: '#D34A6A' }}>削除する</button>
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        // ============================================================
        // カウンセリングフォーム（紙の問診票をデジタル化）
        // ============================================================
        const C_TRIGGER_MAIN = ['ホットペッパー', 'Googleマイビジネス', 'Instagram', 'Threads', 'facebook', '検索ワード', '新聞折込み', 'チラシ', 'タウン誌', '知り合いからのおすすめ', '当院スタッフの紹介'];
        const C_SEARCH_WORDS = ['骨盤矯正', '小顔矯正', 'ダイエット', 'ボディメイク', 'その他'];
        const C_EXPERIENCED = ['整骨院治療', '鍼灸治療', '整形外科リハビリ', '骨盤矯正', '背骨矯正', '小顔矯正', '整体', 'ストレッチ', 'マッサージ', 'カイロプラクティック', '足つぼ', 'エステ（フェイシャル）', 'エステ（ボディ）', 'エステ（痩身）', 'オイルマッサージ'];
        const C_BODY_COMPLAINTS = ['姿勢が悪い', '猫背', '下腹ポッコリ', 'メタボ', 'ウエストライン', 'O脚X脚', '太もも', 'おしり', 'たるみ', '産後太り', '体重増加'];
        const C_FUNCTION_ISSUES = ['肩こり', '腰痛', '関節痛（膝）', '関節痛（股関節）', '関節痛（肩）', '疲れやすい', 'つまづきやすい', '便秘', '寝つきが悪い', '冷え性', '腹筋ができない', '尿漏れ', '頻尿', '立ち上がりがきつい'];
        const C_GOALS = ['体型やスタイルの変化', '痛みからの解放', '筋力の向上', '運動パフォーマンス向上'];
        const C_CONCERN_GROUPS = [
            { name: '目の症状', items: ['目が疲れる', '目が乾く', 'めまいがする', '立ちくらみ'] },
            { name: 'お顔まわり', items: ['顔の歪み・左右差', '目の大きさ・高さ', 'エラの張り', '頬骨のでっぱり', 'たるみ', '二重あご', 'ほうれい線', 'シワ', 'くすみ', '顎関節症', 'クマ', '乾燥', 'むくみ', '疲れ顔'] },
            { name: '頭・首・肩', items: ['頭が痛い・重い', '首が凝る・痛い', '肩が凝る・痛い', '肩甲骨・背中の凝り'] },

            const canvasRef = useRef(null);
            const drawing = useRef(false);
            const hasStroke = useRef(false);
            useEffect(() => {
                const c = canvasRef.current;
                if (!c) return;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, c.width, c.height);
                if (value) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height);
                    img.src = value;
                }
            }, []);
            const pos = (e) => {
                const c = canvasRef.current;
                const rect = c.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: (t.clientX - rect.left) * (c.width / rect.width), y: (t.clientY - rect.top) * (c.height / rect.height) };
            };
            const start = (e) => { e.preventDefault(); drawing.current = true; const p = pos(e); const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
            const move = (e) => {
                if (!drawing.current) return;
                e.preventDefault();
                const p = pos(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.strokeStyle = '#3E2A31'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineTo(p.x, p.y); ctx.stroke();
                hasStroke.current = true;
            };
            const end = () => {
                if (!drawing.current) return;
                drawing.current = false;
                if (hasStroke.current) onChange(canvasRef.current.toDataURL('image/png'));
            };
            const clear = () => {
                const c = canvasRef.current;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
                hasStroke.current = false;
                onChange(null);
            };
            return (
                <div>
                    <div className="rounded-xl overflow-hidden border-2 border-dashed border-plum-200 bg-white relative">
                        <canvas ref={canvasRef} width={640} height={200} className="w-full block" style={{ touchAction: 'none' }}
                            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
                            onTouchStart={start} onTouchMove={move} onTouchEnd={end} />

                        </CSection>

                        {/* 12. 同意署名 */}
                        <CSection num="12" title="ご同意の署名"
                            note="注意事項を聞き、施術・楽トレを受ける事に対して自己責任とし、禁忌事項の内容に該当がなければ署名をお願いいたします。">
                            <SignaturePad value={data.signature} onChange={sig => set({ signature: sig })} />
                        </CSection>
                    </div>

                    {/* 保存バー */}
                    <div className="absolute bottom-0 inset-x-0 p-4 flex gap-2" style={{ background: 'linear-gradient(transparent, #FDF6F5 35%)' }}>
                        <button onClick={onClose} className="px-5 py-3.5 rounded-2xl text-sm font-bold text-plum-400 bg-white border border-plum-100 shadow-md">閉じる</button>
                        <button onClick={save} className="flex-1 py-3.5 rounded-2xl text-white font-bold text-sm shadow-lg"
                            style={{ background: 'linear-gradient(135deg,#904C63,#663347)' }}>
                            カウンセリング内容を保存
