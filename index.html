    <!-- ============================================================
         Dear美容整体 姿勢分析ツール — スタンドアロン版
         このHTMLファイル1枚をブラウザで開くだけで動作します（サーバー不要）。

         ▼ 主な機能
           - 顧客カルテ管理（来店回数に応じたガイド付きフロー）
             1回目: カウンセリング → 骨盤矯正 → 着衣のままビフォー撮影のみ
                    （アフター撮影は「早期クロージング」用に任意で可能）→ 次回予約
             2回目: コアレ → 水着に着替えて採寸（17部位）+ 撮影
             3回目以降: 月1〜2回来店 / 2〜3ヶ月ペースで採寸&撮影を自動リマインド
           - カメラ撮影（正面・背面・側面）→ MediaPipe Pose 骨格検出
             → 各ビュー8項目・計24ポイントの詳細姿勢分析
           - 写真の保存（端末内 IndexedDB に顧客別で蓄積 + 端末フォトへ書き出し）
           - ビフォーアフター比較画像の生成
           - PDF出力（9枚つらなりレイアウト + 採寸履歴表 / 外部ライブラリ不要の自前PDF生成）
           - LINE連携: Web Share APIでビフォーアフター画像をLINEへ共有
             （バックエンドがある場合は設定画面のエンドポイントへPOSTも可能）

         ▼ データ保存先
           - 顧客・来店・カウンセリング・採寸: localStorage (dear_customers_v1)
           - 写真: IndexedDB (dear_posture_db / photos)
           すべて端末内に保存されます。ブラウザデータ削除で消えるため、
           定期的にPDF・写真の書き出しをおすすめします。
         ============================================================ -->

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        :root {
            --dear-coral: #E8837E;
            --dear-coral-deep: #C94D4D;
            --dear-plum: #904C63;
            --dear-plum-deep: #663347;
            --dear-gold: #C0B084;
            --dear-bg: #FDF6F5;
        }
        html { scroll-behavior: smooth; }
        body { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; margin: 0; background: var(--dear-bg); color: #3E2A31; }
        .font-mincho { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; }
        .skeleton {
            background: linear-gradient(90deg, #f6ecea 25%, #eeddd9 37%, #f6ecea 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }
        @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        /* トースト */
        #dear-toast-root { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 99999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .dear-toast { pointer-events: auto; min-width: 220px; max-width: 90vw; padding: 12px 18px; border-radius: 14px; color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(102,51,71,.25); animation: dear-toast-in .25s ease; }
        @keyframes dear-toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes dear-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dear-slide-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes dear-scale-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
        .animate-dear-fade { animation: dear-fade-in .3s ease; }
        .animate-dear-up { animation: dear-slide-up .35s cubic-bezier(0.16,1,0.3,1); }
        .animate-dear-scale { animation: dear-scale-in .25s cubic-bezier(0.16,1,0.3,1); }
        /* 鳳凰の羽をイメージした装飾スウッシュ */
        .dear-hero {
            background:
                radial-gradient(120% 90% at 100% 0%, rgba(232,131,126,0.16) 0%, rgba(232,131,126,0) 55%),
                radial-gradient(90% 80% at 0% 100%, rgba(192,176,132,0.14) 0%, rgba(192,176,132,0) 60%),
                linear-gradient(135deg, #FFFFFF 0%, #FDF3F1 100%);
        }
        .dear-plum-hero {
            background:
                radial-gradient(120% 100% at 100% 0%, rgba(232,131,126,0.35) 0%, rgba(232,131,126,0) 60%),
                radial-gradient(100% 90% at 0% 100%, rgba(192,176,132,0.22) 0%, rgba(192,176,132,0) 55%),
                linear-gradient(135deg, #522939 0%, #663347 55%, #904C63 100%);
        }
        .dear-card { background: #fff; border: 1px solid #F3DFDC; border-radius: 18px; box-shadow: 0 2px 10px rgba(144,76,99,0.05); }
        .dear-chip { transition: all .15s ease; user-select: none; }
        .dear-chip.on { background: #904C63; color: #fff; border-color: #904C63; }
        .dear-chip.off { background: #fff; color: #6b5560; border-color: #E9D5D9; }
        input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="tel"], select, textarea {
            border-color: #E9D5D9 !important; border-radius: 10px; background: #fff;
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid rgba(232,131,126,0.5); outline-offset: 0; }
        ::placeholder { color: #C9AEB6; }
        /* 細めのスクロールバー */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #E9CFC9; border-radius: 3px; }

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef, useCallback, useMemo, useLayoutEffect } = React;

        // ============================================================
        // 共通ヘルパー
        // ============================================================
        const BRAND = {
            coral: '#E8837E', coralDeep: '#C94D4D', coralLight: '#F2BBB6',
            plum: '#904C63', plumDeep: '#663347', plumDark: '#522939',
            gold: '#C0B084', goldDeep: '#A99560',
            bg: '#FDF6F5', line: '#06C755',
        };

        const todayLocalYMD = () => {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const fmtDateJP = (ymd) => {
            if (!ymd) return '—';
            const [y, m, d] = ymd.split('-').map(Number);
            return `${y}年${m}月${d}日`;
        };
        const fmtDateShort = (ymd) => ymd ? ymd.replace(/-/g, '.') : '—';
        const daysBetween = (ymdA, ymdB) => {
            if (!ymdA || !ymdB) return null;
            const a = new Date(ymdA + 'T00:00:00'), b = new Date(ymdB + 'T00:00:00');
            return Math.round((b - a) / 86400000);
        };
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const calcAge = (birthYmd) => {
            if (!birthYmd) return null;
            const b = new Date(birthYmd + 'T00:00:00');
            if (isNaN(b)) return null;
            const now = new Date();
            let age = now.getFullYear() - b.getFullYear();
            const md = (now.getMonth() - b.getMonth()) * 100 + (now.getDate() - b.getDate());
            if (md < 0) age--;
            return age;
        };

        // --- 触覚フィードバック ---
        const prefersReducedMotion = typeof window !== 'undefined' && window.matchMedia
            ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
        const _hapticEnabled = () => (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function' && !prefersReducedMotion);
        const hapticTap = () => { if (_hapticEnabled()) { try { navigator.vibrate(10); } catch (_) {} } };
        const hapticSuccess = () => { if (_hapticEnabled()) { try { navigator.vibrate([8, 30, 8]); } catch (_) {} } };
        const hapticError = () => { if (_hapticEnabled()) { try { navigator.vibrate([30, 20, 30]); } catch (_) {} } };

        // --- トースト通知 ---
        const showToast = (message, type = 'info', duration = 3500) => {
            const bg = { success: '#3D9B7B', error: '#D34A6A', info: '#904C63', warning: '#C08A2E' }[type] || '#904C63';
            const root = document.getElementById('dear-toast-root');
            if (!root) { console.log(`[toast:${type}]`, message); return; }
            const el = document.createElement('div');
            el.className = 'dear-toast';
            el.style.background = bg;
            el.textContent = message;
            root.appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity .3s ease';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, duration);
        };

        // ============================================================
        // データ層
        //  - 顧客・来店・カウンセリング・採寸: localStorage
        //  - 写真: IndexedDB（容量が大きいため）
        // ============================================================
        const LS_CUSTOMERS = 'dear_customers_v1';
        const LS_SETTINGS = 'dear_settings_v1';

        const loadCustomers = () => {
            try { return JSON.parse(localStorage.getItem(LS_CUSTOMERS) || '[]'); }
            catch (_) { return []; }
        };
        const persistCustomers = (customers) => {
            try { localStorage.setItem(LS_CUSTOMERS, JSON.stringify(customers)); return true; }
            catch (e) { console.error(e); showToast('保存に失敗しました（容量不足の可能性）', 'error'); return false; }
        };
        const loadSettings = () => {
            try { return { storeName: 'Dear美容整体', staffName: '', lineEndpoint: '', ...JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}') }; }
            catch (_) { return { storeName: 'Dear美容整体', staffName: '', lineEndpoint: '' }; }
        };
        const persistSettings = (s) => { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); } catch (_) {} };

        // --- IndexedDB 写真ストア ---
        const IDB_NAME = 'dear_posture_db';
        const IDB_STORE = 'photos';
        let _idbPromise = null;
        const openDB = () => {
            if (_idbPromise) return _idbPromise;
            _idbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        const store = db.createObjectStore(IDB_STORE, { keyPath: 'id' });
                        store.createIndex('customerId', 'customerId', { unique: false });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return _idbPromise;
        };
        const idbPutPhoto = async (photo) => {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(photo);
                tx.oncomplete = () => resolve(photo.id);
                tx.onerror = () => reject(tx.error);

        // ============================================================
        // 自前PDF生成（外部ライブラリ不要）
        // JPEGページ画像をA4に等倍配置した複数ページPDFを組み立てる。
        // pages: [{ dataUrl (image/jpeg), }...]  → Blob (application/pdf)
        // ============================================================
        const A4_W = 595.28, A4_H = 841.89;
        function buildPdfFromJpegPages(pages) {
            const enc = new TextEncoder();
            const chunks = [];
            let offset = 0;
            const offsets = {};
            const push = (data) => {
                const b = (typeof data === 'string') ? enc.encode(data) : data;
                chunks.push(b); offset += b.length;
            };
            const beginObj = (num) => { offsets[num] = offset; push(`${num} 0 obj\n`); };

            push('%PDF-1.4\n');
            push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])); // バイナリマーカー

            const n = pages.length;
            // オブジェクト番号: 1=Catalog, 2=Pages, ページiごとに (3+3i)=Page, (4+3i)=Contents, (5+3i)=Image
            beginObj(1);
            push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
            beginObj(2);
            const kids = pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ');
            push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);

            pages.forEach((p, i) => {
                const pageNum = 3 + 3 * i, contNum = 4 + 3 * i, imgNum = 5 + 3 * i;
                const jpeg = dataUrlToU8(p.dataUrl);
                // JPEGのピクセルサイズをSOFマーカーから取得
                let w = p.wPx || 0, h = p.hPx || 0;
                if (!w || !h) {
                    for (let j = 2; j < jpeg.length - 9;) {
                        if (jpeg[j] !== 0xFF) { j++; continue; }
                        const marker = jpeg[j + 1];
                        if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
                            h = (jpeg[j + 5] << 8) | jpeg[j + 6];
                            w = (jpeg[j + 7] << 8) | jpeg[j + 8];
                            break;
                        }
                        const len = (jpeg[j + 2] << 8) | jpeg[j + 3];
                        j += 2 + len;
                    }
                }
                beginObj(pageNum);
                push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4_W} ${A4_H}] /Contents ${contNum} 0 R /Resources << /XObject << /Im${i} ${imgNum} 0 R >> /ProcSet [/PDF /ImageC] >> >>\nendobj\n`);
                const content = `q ${A4_W} 0 0 ${A4_H} 0 0 cm /Im${i} Do Q`;
                beginObj(contNum);
                push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
                beginObj(imgNum);
                push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
                push(jpeg);
                push('\nendstream\nendobj\n');
            });

            const totalObjs = 2 + 3 * n;
            const xrefOffset = offset;
            let xref = `xref\n0 ${totalObjs + 1}\n0000000000 65535 f \n`;
            for (let num = 1; num <= totalObjs; num++) {
                xref += String(offsets[num]).padStart(10, '0') + ' 00000 n \n';
            }
            push(xref);
            push(`trailer\n<< /Size ${totalObjs + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);

            const total = chunks.reduce((s, c) => s + c.length, 0);
            const out = new Uint8Array(total);
            let pos = 0;
            for (const c of chunks) { out.set(c, pos); pos += c.length; }
            return new Blob([out], { type: 'application/pdf' });
        }

        // ============================================================
        // 姿勢分析エンジン
        // MediaPipe Pose 公式ランドマーク番号（旧版の耳=3/4は誤りだったため修正）
        // ============================================================
        const POSTURE_LM = {
            NOSE: 0,
            LEFT_EYE: 2, RIGHT_EYE: 5,
            LEFT_EAR: 7, RIGHT_EAR: 8,
            LEFT_SHOULDER: 11, RIGHT_SHOULDER: 12,
            LEFT_ELBOW: 13, RIGHT_ELBOW: 14,
            LEFT_WRIST: 15, RIGHT_WRIST: 16,
            LEFT_HIP: 23, RIGHT_HIP: 24,
            LEFT_KNEE: 25, RIGHT_KNEE: 26,
            LEFT_ANKLE: 27, RIGHT_ANKLE: 28,
            LEFT_HEEL: 29, RIGHT_HEEL: 30,
        };
        const VIEW_LABELS = { front: '正面', back: '背面', side: '側面' };
        const viewLabelOf = (v) => VIEW_LABELS[v] || v;

        function postureCalcAngle(a, b, c) {
            const ab = { x: a.x - b.x, y: a.y - b.y }, cb = { x: c.x - b.x, y: c.y - b.y };
            const dot = ab.x * cb.x + ab.y * cb.y;
            const m1 = Math.sqrt(ab.x ** 2 + ab.y ** 2), m2 = Math.sqrt(cb.x ** 2 + cb.y ** 2);
            if (!m1 || !m2) return 0;
            return Math.acos(Math.min(1, Math.max(-1, dot / (m1 * m2)))) * (180 / Math.PI);
        }
        function postureMid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
        function postureLmConfidence(...lms) {
            const vs = lms.filter(l => l && l.visibility != null).map(l => l.visibility);
            return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : 0;
        }
        // 水平からの傾き角（度）: 2点の y差/x差
        function tiltDegrees(a, b) {
            const dx = Math.abs(b.x - a.x), dy = b.y - a.y;
            if (dx < 0.001) return 0;
            return Math.atan2(Math.abs(dy), dx) * (180 / Math.PI);
        }

        // スコア配色（ブランドに合わせ調整。良好=翡翠 / 注意=金 / 要改善=橙 / 要施術=紅）
        function postureScoreColor(s) { return s >= 80 ? '#2F9C7C' : s >= 60 ? '#B8912E' : s >= 40 ? '#DA7A3C' : '#D34A6A'; }
        function postureScoreLabel(s) { return s >= 80 ? '良好' : s >= 60 ? 'やや注意' : s >= 40 ? '要改善' : '要施術'; }
        function postureScoreBg(s) { return s >= 80 ? '#E6F4EE' : s >= 60 ? '#F7EFDA' : s >= 40 ? '#FAEADD' : '#FAE3E9'; }

        function bandScore(v, t1, t2, t3) {
            const x = Math.abs(v);
            if (x <= t1) return Math.round(100 - (x / t1) * 10);
            if (x <= t2) return Math.round(90 - ((x - t1) / (t2 - t1)) * 20);
            if (x <= t3) return Math.round(70 - ((x - t2) / (t3 - t2)) * 30);
            return Math.round(Math.max(0, 40 - (x - t3) * (30 / t3)));

        // ---------------- 正面分析（8項目） ----------------
        function postureAnalyzeFront(lm) {
            const L = POSTURE_LM;
            const nose = lm[L.NOSE], lEar = lm[L.LEFT_EAR], rEar = lm[L.RIGHT_EAR];
            const ls = lm[L.LEFT_SHOULDER], rs = lm[L.RIGHT_SHOULDER];
            const lh = lm[L.LEFT_HIP], rh = lm[L.RIGHT_HIP];
            const lk = lm[L.LEFT_KNEE], rk = lm[L.RIGHT_KNEE];
            const la = lm[L.LEFT_ANKLE], ra = lm[L.RIGHT_ANKLE];
            const sMid = postureMid(ls, rs), hMid = postureMid(lh, rh);
            const shoulderWidth = Math.sqrt((rs.x - ls.x) ** 2 + (rs.y - ls.y) ** 2);
            const refLen = shoulderWidth > 0.01 ? shoulderWidth : 0.2;
            const cmPerUnit = POSTURE_REF_SHOULDER_WIDTH_CM / refLen;

            // 1. 頭部の左右位置（鼻 vs 肩中点）
            const headOffsetRaw = Math.abs(nose.x - sMid.x);
            const headOffset = (headOffsetRaw / refLen) * 6;

            const earTilt = tiltDegrees(lEar, rEar);
            // 3. 肩の高さ左右差

            // 4. 骨盤の高さ左右差

            // 6. 体幹の回旋（肩のz差から推定）
            const zL = ls.z != null ? ls.z : 0, zR = rs.z != null ? rs.z : 0;

            const kneeTilt = tiltDegrees(lk, rk);
            // 8. O脚・X脚傾向（膝間隔 と 足首間隔 の差）
            const kneeGap = Math.abs(lk.x - rk.x);
            const ankleGap = Math.abs(la.x - ra.x);
            const legDiffRaw = kneeGap - ankleGap; // + = 膝が開く(O脚傾向) / − = 膝が閉じる(X脚傾向)
            const legDiffPct = (legDiffRaw / refLen) * 100;

                    value: shoulderTilt.toFixed(1) + '°',

                },
                {

                {

        // ---------------- 背面分析（8項目） ----------------
        function postureAnalyzeBack(lm) {
            const L = POSTURE_LM;
            const nose = lm[L.NOSE];
            const ls = lm[L.LEFT_SHOULDER], rs = lm[L.RIGHT_SHOULDER];
            const le = lm[L.LEFT_ELBOW], re = lm[L.RIGHT_ELBOW];
            const lh = lm[L.LEFT_HIP], rh = lm[L.RIGHT_HIP];
            const lk = lm[L.LEFT_KNEE], rk = lm[L.RIGHT_KNEE];
            const la = lm[L.LEFT_ANKLE], ra = lm[L.RIGHT_ANKLE];
            const sMid = postureMid(ls, rs), hMid = postureMid(lh, rh);
            const shoulderWidth = Math.sqrt((rs.x - ls.x) ** 2 + (rs.y - ls.y) ** 2);
            const refLen = shoulderWidth > 0.01 ? shoulderWidth : 0.2;
            const cmPerUnit = POSTURE_REF_SHOULDER_WIDTH_CM / refLen;

            const shoulderTilt = tiltDegrees(ls, rs);
            const elbowTilt = tiltDegrees(le, re);
            const hipTilt = tiltDegrees(lh, rh);
            // 脊柱の左右偏位: 頭部が体幹軸（肩中点-骨盤中点）からどれだけ外れるか
            const spineDeviation = (function () {
                if (!nose || nose.visibility < 0.5) return 0;
                const vx = sMid.x - hMid.x, vy = sMid.y - hMid.y;
                const len = Math.sqrt(vx * vx + vy * vy);
                if (len < 0.001) return 0;
                const hx = nose.x - sMid.x, hy = nose.y - sMid.y;
                const cross = (vx * hy - vy * hx) / len;
                return (Math.abs(cross) / refLen) * 6;
            })();
            const spineDir = (function () {
                if (!nose || nose.visibility < 0.5) return '判定不可';
                const vx = sMid.x - hMid.x, vy = sMid.y - hMid.y;
                const len = Math.sqrt(vx * vx + vy * vy);
                if (len < 0.001) return '判定不可';
                const hx = nose.x - sMid.x, hy = nose.y - sMid.y;
                const cross = (vx * hy - vy * hx) / len;
                return cross > 0 ? '右に偏位' : '左に偏位';
            })();
            const trunkLateral = (Math.abs(sMid.x - hMid.x) / refLen) * 6;
            const zHL = lh.z != null ? lh.z : 0, zHR = rh.z != null ? rh.z : 0;
            const hipRotDeg = Math.abs(Math.atan2(zHL - zHR, refLen) * (180 / Math.PI));
            const kneeTilt = tiltDegrees(lk, rk);
            const ankleTilt = tiltDegrees(la, ra);

            return { items: [
                {
                    key: 'shoulder', label: '肩の高さ左右差',
                    score: bandScore(shoulderTilt, 2, 5, 10),
                    confidence: postureLmConfidence(ls, rs),
                    detail: shoulderTilt < 1 ? '均等' : ls.y < rs.y ? '左肩が高い' : '右肩が高い',
                    value: shoulderTilt.toFixed(1) + '°',
                    valueCm: (Math.abs(ls.y - rs.y) * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.shoulder,
                    reference: REF_FORTIN2011,
                },
                {
                    key: 'scapula', label: '肩甲骨バランス（肘の高さ）',
                    score: bandScore(elbowTilt, 2.5, 6, 12),
                    confidence: postureLmConfidence(le, re),
                    detail: elbowTilt < 1.5 ? '均等' : le.y < re.y ? '左が高い' : '右が高い',
                    value: elbowTilt.toFixed(1) + '°',
                    valueCm: (Math.abs(le.y - re.y) * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.scapula,
                },
                {
                    key: 'pelvis', label: '骨盤の高さ左右差',
                    score: bandScore(hipTilt, 2, 5, 10),
                    confidence: postureLmConfidence(lh, rh),
                    detail: hipTilt < 1 ? '均等' : lh.y < rh.y ? '左が高い' : '右が高い',
                    value: hipTilt.toFixed(1) + '°',
                    valueCm: (Math.abs(lh.y - rh.y) * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.pelvis,
                    reference: REF_HERRINGTON2011,
                },
                {
                    key: 'spine', label: '脊柱の左右偏位',
                    score: bandScore(spineDeviation, 1, 2.5, 5),
                    confidence: postureLmConfidence(nose, ls, rs, lh, rh),
                    detail: spineDeviation < 1 ? '正中' : spineDir,
                    value: spineDeviation.toFixed(1) + '%偏位',
                    valueCm: (spineDeviation / 6 * refLen * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.spine,
                    reference: REF_FORTIN2011,
                },
                {
                    key: 'trunk', label: '体幹の左右傾斜',
                    score: bandScore(trunkLateral, 1.5, 3, 5),
                    confidence: postureLmConfidence(ls, rs, lh, rh),
                    detail: trunkLateral < 1 ? '正中' : sMid.x < hMid.x ? '左に傾斜' : '右に傾斜',
                    value: trunkLateral.toFixed(1) + '%偏位',
                    valueCm: (Math.abs(sMid.x - hMid.x) * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.trunk,
                    reference: REF_FERREIRA2010,
                },
                {
                    key: 'hipRotation', label: '骨盤の回旋（ねじれ）',
                    score: bandScore(hipRotDeg, 5, 12, 22),
                    confidence: postureLmConfidence(lh, rh),
                    detail: hipRotDeg < 3 ? 'ねじれなし' : zHL < zHR ? '左が前に出ている' : '右が前に出ている',
                    value: '推定 ' + hipRotDeg.toFixed(0) + '°',
                    valueCm: null,
                    advice: ITEM_ADVICE.hipRotation,
                },
                {
                    key: 'knee', label: '膝裏の高さ左右差',
                    score: bandScore(kneeTilt, 1.5, 4, 8),
                    confidence: postureLmConfidence(lk, rk),
                    detail: kneeTilt < 1 ? '均等' : lk.y < rk.y ? '左膝が高い' : '右膝が高い',
                    value: kneeTilt.toFixed(1) + '°',
                    valueCm: (Math.abs(lk.y - rk.y) * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.knee,
                    reference: REF_FERREIRA2010,
                },
                {
                    key: 'achilles', label: '足首・かかとの左右差',
                    score: bandScore(ankleTilt, 1.5, 4, 8),
                    confidence: postureLmConfidence(la, ra),
                    detail: ankleTilt < 1 ? '均等' : la.y < ra.y ? '左が高い' : '右が高い',
                    value: ankleTilt.toFixed(1) + '°',
                    valueCm: (Math.abs(la.y - ra.y) * cmPerUnit).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.achilles,
                },
            ] };
        }

        // ---------------- 側面分析（8項目） ----------------
        function postureAnalyzeSide(lm) {
            const L = POSTURE_LM;
            const ear = lm[L.LEFT_EAR], sh = lm[L.LEFT_SHOULDER];
            const hip = lm[L.LEFT_HIP], knee = lm[L.LEFT_KNEE], ankle = lm[L.LEFT_ANKLE];
            const shHipDist = Math.sqrt((sh.x - hip.x) ** 2 + (sh.y - hip.y) ** 2);
            const refLenSide = shHipDist > 0.01 ? shHipDist : 0.15;
            const cmPerUnitSide = POSTURE_REF_SH_HIP_DIST_CM / refLenSide;

            // 1. CVA（頭部前方偏位）
            const headFwd = ear.x - sh.x;
            const estimatedCVA = 60 - (Math.abs(headFwd) / refLenSide) * 22;
            const cvaScore =
                estimatedCVA >= 55 ? Math.round(Math.min(100, 90 + (estimatedCVA - 55) * 2)) :
                estimatedCVA >= 50 ? Math.round(70 + (estimatedCVA - 50) * 4) :
                estimatedCVA >= 45 ? Math.round(40 + (estimatedCVA - 45) * 6) :
                Math.round(Math.max(0, estimatedCVA * 0.9));
            // 2. 猫背・胸椎後弯（耳-肩-腰 角度）
            const shAngle = postureCalcAngle(ear, sh, hip);
            const kyphosisScore =
                shAngle >= 160 ? Math.round(Math.min(100, 90 + (shAngle - 160) * 0.5)) :
                shAngle >= 150 ? Math.round(70 + (shAngle - 150) * 2) :
                shAngle >= 140 ? Math.round(40 + (shAngle - 140) * 3) :
                Math.round(Math.max(0, shAngle * 0.29));
            // 3. 肩の前方偏位（巻き肩: 肩 vs 大転子の前後差）
            const shoulderFwdRaw = sh.x - hip.x;
            const shoulderFwdPct = (Math.abs(shoulderFwdRaw) / refLenSide) * 100;
            // 4. 体幹の前後傾（肩-腰ラインの鉛直からの角度）
            const trunkLeanDeg = Math.atan2(Math.abs(sh.x - hip.x), Math.abs(hip.y - sh.y)) * (180 / Math.PI);
            // 5. 骨盤の前後傾（肩-腰-膝 角度）
            const hipAngle = postureCalcAngle(sh, hip, knee);
            const pelvicDeviation = Math.abs(hipAngle - 170);
            // 6. 膝の過伸展（腰-膝-足首 角度）
            const kneeAngle = postureCalcAngle(hip, knee, ankle);
            const kneeDeviation = Math.abs(kneeAngle - 175);
            // 7. スウェイバック（大転子が 肩-足首ライン より前方に出る）
            const swayRaw = (function () {
                const dy = ankle.y - sh.y;
                if (Math.abs(dy) < 0.001) return 0;
                const t = (hip.y - sh.y) / dy;
                const lineX = sh.x + (ankle.x - sh.x) * t;
                return hip.x - lineX; // + = 前方（撮影向きに依存するため絶対値評価）
            })();
            const swayPct = (Math.abs(swayRaw) / refLenSide) * 100;
            // 8. 重心の前後バランス（耳 vs 足首の前後差 = 全身プラムライン）
            const plumbRaw = ear.x - ankle.x;
            const plumbPct = (Math.abs(plumbRaw) / refLenSide) * 100;

            return { items: [
                {
                    key: 'cva', label: '頭部前方偏位（CVA）',
                    score: cvaScore,
                    confidence: postureLmConfidence(ear, sh),
                    detail: estimatedCVA >= 55 ? '正常' : estimatedCVA >= 50 ? '軽度の前方偏位' : estimatedCVA >= 45 ? '中度の前方偏位' : '重度の前方偏位（ストレートネック疑い）',
                    value: '推定CVA ' + Math.round(estimatedCVA) + '°',
                    valueCm: (Math.abs(headFwd) * cmPerUnitSide).toFixed(1) + 'cm前方',
                    advice: ITEM_ADVICE.cva,
                    reference: REF_SHAGHAYEGH2016,
                },
                {
                    key: 'kyphosis', label: '猫背・胸椎後弯',
                    score: kyphosisScore,
                    confidence: postureLmConfidence(ear, sh, hip),
                    detail: shAngle >= 160 ? '正常' : shAngle >= 150 ? '軽度の猫背' : shAngle >= 140 ? '中度の猫背' : '猫背傾向が強い',
                    value: shAngle.toFixed(0) + '°',
                    valueCm: null,
                    advice: ITEM_ADVICE.kyphosis,
                    reference: REF_SINGLA2017_SH,
                },
                {
                    key: 'shoulderFwd', label: '肩の前方偏位（巻き肩）',
                    score: bandScore(shoulderFwdPct, 8, 16, 28),
                    confidence: postureLmConfidence(sh, hip),
                    detail: shoulderFwdPct < 6 ? '正常範囲' : shoulderFwdRaw * (headFwd >= 0 ? 1 : -1) >= 0 ? '肩が前方に偏位' : '肩が後方に偏位',
                    value: shoulderFwdPct.toFixed(0) + '%偏位',
                    valueCm: (Math.abs(shoulderFwdRaw) * cmPerUnitSide).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.shoulderFwd,
                    reference: REF_SINGLA2017_SH,
                },
                {
                    key: 'trunkLean', label: '体幹の前後傾',
                    score: bandScore(trunkLeanDeg, 3, 7, 13),
                    confidence: postureLmConfidence(sh, hip),
                    detail: trunkLeanDeg < 2 ? '垂直' : '前後に' + trunkLeanDeg.toFixed(0) + '°傾斜',
                    value: trunkLeanDeg.toFixed(1) + '°',
                    valueCm: (Math.abs(sh.x - hip.x) * cmPerUnitSide).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.trunkLean,
                    reference: REF_FERREIRA2010,
                },
                {
                    key: 'pelvisTilt', label: '骨盤の前後傾斜',
                    score: bandScore(pelvicDeviation, 5, 10, 15),
                    confidence: postureLmConfidence(sh, hip, knee),
                    detail: pelvicDeviation <= 5 ? '正常範囲' : hipAngle > 170 ? '後傾傾向' : '前傾傾向',
                    value: hipAngle.toFixed(0) + '°',
                    valueCm: null,
                    advice: ITEM_ADVICE.pelvisTilt,
                    reference: REF_HERRINGTON2011,
                },
                {
                    key: 'kneeExt', label: '膝の過伸展',
                    score: bandScore(kneeDeviation, 5, 10, 15),
                    confidence: postureLmConfidence(hip, knee, ankle),
                    detail: kneeDeviation <= 5 ? '正常範囲' : kneeAngle > 180 ? '過伸展' : 'やや屈曲',
                    value: kneeAngle.toFixed(0) + '°',
                    valueCm: null,
                    advice: ITEM_ADVICE.kneeExt,
                    reference: REF_LOUDON1998,
                },
                {
                    key: 'sway', label: 'スウェイバック傾向',
                    score: bandScore(swayPct, 6, 13, 24),
                    confidence: postureLmConfidence(sh, hip, ankle),
                    detail: swayPct < 5 ? '正常範囲' : '腰が肩-足首ラインから' + swayPct.toFixed(0) + '%偏位',
                    value: swayPct.toFixed(0) + '%偏位',
                    valueCm: (Math.abs(swayRaw) * cmPerUnitSide).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.sway,
                },
                {
                    key: 'plumb', label: '重心の前後バランス',
                    score: bandScore(plumbPct, 8, 16, 30),
                    confidence: postureLmConfidence(ear, ankle),
                    detail: plumbPct < 6 ? '耳-足首が揃っています' : '重心線が前後にズレています',
                    value: plumbPct.toFixed(0) + '%偏位',
                    valueCm: (Math.abs(plumbRaw) * cmPerUnitSide).toFixed(1) + 'cm',
                    advice: ITEM_ADVICE.plumb,
                    reference: REF_FERREIRA2010,
                },
            ] };
        }

        const analyzeByView = (lm, viewMode) =>
            viewMode === 'front' ? postureAnalyzeFront(lm) :
            viewMode === 'back' ? postureAnalyzeBack(lm) :
            postureAnalyzeSide(lm);

        // 信頼度が極低（<0.5）の項目は除外して総合スコアを算出
        function postureGetTotal(a) {
            if (!a || !a.items) return null;
            const valid = a.items.filter(i => i.confidence == null || i.confidence >= 0.5);
            if (valid.length === 0) return null;
            return Math.round(valid.reduce((s, i) => s + i.score, 0) / valid.length);
        }

        // ローカルアドバイス生成（バックエンド不要）
        function generateLocalAdvice(analysis, viewMode) {
            if (!analysis || !analysis.items) return '';
            const total = postureGetTotal(analysis);
            const lows = analysis.items
                .filter(i => (i.confidence == null || i.confidence >= 0.5) && i.score < 70)
                .sort((a, b) => a.score - b.score);
            const lines = [];
            if (total != null) {
                lines.push(
                    total >= 80 ? `${viewLabelOf(viewMode)}の姿勢は概ね良好です。現在の良い状態をキープしましょう。` :
                    total >= 60 ? `${viewLabelOf(viewMode)}の姿勢に軽度の乱れが見られます。月1〜2回の定期ケアで整えていきましょう。` :
                    total >= 40 ? `${viewLabelOf(viewMode)}の姿勢に複数の改善ポイントがあります。集中的なケアをおすすめします。` :
                    `${viewLabelOf(viewMode)}の姿勢の乱れが顕著です。早めの施術で根本から整えていきましょう。`
                );
            }
            lows.slice(0, 4).forEach(i => {
                lines.push(`■ ${i.label}（${i.score}点 / ${i.detail}）\n${i.advice || ''}`);
            });
            if (lows.length === 0) lines.push('大きな崩れは見られません。定期的なチェックで維持していきましょう。');
            return lines.join('\n\n');
        }

        // ============================================================

        // ============================================================

        // ビュー別の骨格接続線
        function viewConnectionsOf(viewMode) {
            if (viewMode === 'front') return [[7, 8], [11, 12], [11, 23], [12, 24], [23, 24], [23, 25], [24, 26], [25, 27], [26, 28]];
            if (viewMode === 'back') return [[11, 12], [11, 13], [12, 14], [11, 23], [12, 24], [23, 24], [23, 25], [24, 26], [25, 27], [26, 28]];
            return [[7, 11], [11, 23], [23, 25], [25, 27]]; // side: 耳-肩-腰-膝-足首
        }
        // ビュー別の表示ポイント
        function viewPointsOf(viewMode) {
            const L = POSTURE_LM;
            if (viewMode === 'front') return [L.NOSE, L.LEFT_EAR, L.RIGHT_EAR, L.LEFT_SHOULDER, L.RIGHT_SHOULDER, L.LEFT_HIP, L.RIGHT_HIP, L.LEFT_KNEE, L.RIGHT_KNEE, L.LEFT_ANKLE, L.RIGHT_ANKLE];
            if (viewMode === 'back') return [L.NOSE, L.LEFT_SHOULDER, L.RIGHT_SHOULDER, L.LEFT_ELBOW, L.RIGHT_ELBOW, L.LEFT_HIP, L.RIGHT_HIP, L.LEFT_KNEE, L.RIGHT_KNEE, L.LEFT_ANKLE, L.RIGHT_ANKLE];
            return [L.LEFT_EAR, L.LEFT_SHOULDER, L.LEFT_HIP, L.LEFT_KNEE, L.LEFT_ANKLE];
        }
        // 編集モードで動かせるポイント
        function editableIndicesOf(viewMode) {
            const L = POSTURE_LM;
            if (viewMode === 'front') return [
                { idx: L.NOSE, label: '鼻' }, { idx: L.LEFT_EAR, label: '左耳' }, { idx: L.RIGHT_EAR, label: '右耳' },
                { idx: L.LEFT_SHOULDER, label: '左肩' }, { idx: L.RIGHT_SHOULDER, label: '右肩' },
                { idx: L.LEFT_HIP, label: '左腰' }, { idx: L.RIGHT_HIP, label: '右腰' },
                { idx: L.LEFT_KNEE, label: '左膝' }, { idx: L.RIGHT_KNEE, label: '右膝' },
                { idx: L.LEFT_ANKLE, label: '左足首' }, { idx: L.RIGHT_ANKLE, label: '右足首' },
            ];
            if (viewMode === 'back') return [
                { idx: L.NOSE, label: '頭部' },
                { idx: L.LEFT_SHOULDER, label: '左肩' }, { idx: L.RIGHT_SHOULDER, label: '右肩' },
                { idx: L.LEFT_ELBOW, label: '左肘' }, { idx: L.RIGHT_ELBOW, label: '右肘' },
                { idx: L.LEFT_HIP, label: '左腰' }, { idx: L.RIGHT_HIP, label: '右腰' },
                { idx: L.LEFT_KNEE, label: '左膝' }, { idx: L.RIGHT_KNEE, label: '右膝' },
                { idx: L.LEFT_ANKLE, label: '左足首' }, { idx: L.RIGHT_ANKLE, label: '右足首' },
            ];
            return [
                { idx: L.LEFT_EAR, label: '耳' }, { idx: L.LEFT_SHOULDER, label: '肩' },
                { idx: L.LEFT_HIP, label: '大転子' }, { idx: L.LEFT_KNEE, label: '膝' }, { idx: L.LEFT_ANKLE, label: '足首' },
            ];
        }

        // 各分析項目のオーバーレイ表示位置（正規化座標）
        function itemOverlayPos(item, landmarks, viewMode) {
            const L = POSTURE_LM;
            const nose = landmarks[L.NOSE], lEar = landmarks[L.LEFT_EAR], rEar = landmarks[L.RIGHT_EAR];
            const ls = landmarks[L.LEFT_SHOULDER], rs = landmarks[L.RIGHT_SHOULDER];
            const le = landmarks[L.LEFT_ELBOW], re = landmarks[L.RIGHT_ELBOW];
            const lh = landmarks[L.LEFT_HIP], rh = landmarks[L.RIGHT_HIP];
            const lk = landmarks[L.LEFT_KNEE], rk = landmarks[L.RIGHT_KNEE];
            const la = landmarks[L.LEFT_ANKLE], ra = landmarks[L.RIGHT_ANKLE];
            const sMid = (ls && rs) ? postureMid(ls, rs) : null;
            const hMid = (lh && rh) ? postureMid(lh, rh) : null;
            if (viewMode === 'front') {
                switch (item.key) {
                    case 'head': return nose && { x: nose.x, y: nose.y - 0.055, align: 'center' };
                    case 'earLine': return rEar && { x: rEar.x + 0.05, y: rEar.y, align: 'left' };
                    case 'shoulder': return sMid && { x: sMid.x, y: Math.min(ls.y, rs.y) - 0.028, align: 'center' };
                    case 'pelvis': return hMid && { x: hMid.x, y: Math.min(lh.y, rh.y) - 0.022, align: 'center' };
                    case 'center': return sMid && hMid && { x: Math.max(sMid.x, hMid.x) + 0.13, y: (sMid.y + hMid.y) / 2, align: 'left' };
                    case 'rotation': return sMid && hMid && { x: Math.min(sMid.x, hMid.x) - 0.13, y: (sMid.y * 2 + hMid.y) / 3, align: 'right' };
                    case 'knee': return lk && rk && { x: (lk.x + rk.x) / 2, y: Math.min(lk.y, rk.y) - 0.022, align: 'center' };
                    case 'leg': return la && ra && { x: (la.x + ra.x) / 2, y: Math.min(la.y, ra.y) - 0.022, align: 'center' };
                }
            } else if (viewMode === 'back') {
                switch (item.key) {
                    case 'shoulder': return sMid && { x: sMid.x, y: Math.min(ls.y, rs.y) - 0.028, align: 'center' };
                    case 'scapula': return re && { x: re.x + 0.05, y: re.y, align: 'left' };
                    case 'pelvis': return hMid && { x: hMid.x, y: Math.min(lh.y, rh.y) - 0.022, align: 'center' };
                    case 'spine': return nose && sMid && { x: (nose.x + sMid.x) / 2 + 0.12, y: (nose.y + sMid.y) / 2, align: 'left' };
                    case 'trunk': return sMid && hMid && { x: Math.max(sMid.x, hMid.x) + 0.13, y: (sMid.y + hMid.y) / 2, align: 'left' };
                    case 'hipRotation': return hMid && { x: hMid.x - 0.15, y: hMid.y + 0.03, align: 'right' };
                    case 'knee': return lk && rk && { x: (lk.x + rk.x) / 2, y: Math.min(lk.y, rk.y) - 0.022, align: 'center' };
                    case 'achilles': return la && ra && { x: (la.x + ra.x) / 2, y: Math.min(la.y, ra.y) - 0.022, align: 'center' };
                }
            } else {
                const ear = lEar, sh = ls, hip = lh, knee = lk, ankle = la;
                switch (item.key) {
                    case 'cva': return ear && { x: ear.x, y: ear.y - 0.05, align: 'center' };
                    case 'kyphosis': return sh && { x: sh.x + 0.08, y: sh.y - 0.01, align: 'left' };
                    case 'shoulderFwd': return sh && { x: sh.x - 0.08, y: sh.y + 0.03, align: 'right' };
                    case 'trunkLean': return sh && hip && { x: (sh.x + hip.x) / 2 + 0.1, y: (sh.y + hip.y) / 2, align: 'left' };
                    case 'pelvisTilt': return hip && { x: hip.x + 0.09, y: hip.y, align: 'left' };
                    case 'sway': return hip && { x: hip.x - 0.09, y: hip.y + 0.04, align: 'right' };
                    case 'kneeExt': return knee && { x: knee.x + 0.09, y: knee.y, align: 'left' };
                    case 'plumb': return ankle && { x: ankle.x + 0.09, y: ankle.y - 0.02, align: 'left' };
                }
            }
            return null;
        }

        // Canvas上に骨格を描画
        function postureDrawSkeletonOnCanvas(ctx, w, h, landmarks, analysis, viewMode) {
            if (!landmarks) return;
            ctx.lineCap = 'round';
            const L = POSTURE_LM;
            const lineW = Math.max(2, Math.round(w / 220));
            const r = Math.max(4, Math.round(w / 130));

            viewConnectionsOf(viewMode).forEach(([a, b]) => {
                const la = landmarks[a], lb = landmarks[b];
                if (!la || !lb || la.visibility < 0.5 || lb.visibility < 0.5) return;
                ctx.strokeStyle = SKELETON_LINE;
                ctx.lineWidth = lineW;
                ctx.beginPath();
                ctx.moveTo(la.x * w, la.y * h);
                ctx.lineTo(lb.x * w, lb.y * h);
                ctx.stroke();
            });

            if (viewMode === 'front' || viewMode === 'back') {
                const ls = landmarks[L.LEFT_SHOULDER], rs = landmarks[L.RIGHT_SHOULDER];
                const lh = landmarks[L.LEFT_HIP], rh = landmarks[L.RIGHT_HIP];
                const nose = landmarks[L.NOSE];
                if (ls && rs && lh && rh) {
                    const sm = postureMid(ls, rs), hm = postureMid(lh, rh);
                    // 体軸（正中線）
                    ctx.strokeStyle = SKELETON_SPINE;
                    ctx.lineWidth = Math.max(2.5, Math.round(w / 190));
                    ctx.beginPath();
                    if (nose && nose.visibility >= 0.5) { ctx.moveTo(nose.x * w, nose.y * h); ctx.lineTo(sm.x * w, sm.y * h); }
                    else ctx.moveTo(sm.x * w, sm.y * h);
                    ctx.lineTo(hm.x * w, hm.y * h);
                    ctx.stroke();
                    // 理想の鉛直線（破線）
                    ctx.strokeStyle = SKELETON_AXIS;
                    ctx.lineWidth = Math.max(1.5, Math.round(w / 300));
                    ctx.setLineDash([6, 5]);
                    ctx.beginPath();
                    ctx.moveTo(hm.x * w, Math.max(0, (nose ? nose.y : sm.y) - 0.08) * h);
                    ctx.lineTo(hm.x * w, Math.min(1, hm.y + 0.25) * h);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    // 中点マーカー
                    [sm, hm].forEach(p => {
                        ctx.fillStyle = SKELETON_SPINE;
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = Math.max(1.2, Math.round(w / 450));
                        ctx.beginPath(); ctx.arc(p.x * w, p.y * h, r * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    });
                }
            } else {
                // side: 足首を通る鉛直プラムライン
                const ankle = landmarks[L.LEFT_ANKLE];
                if (ankle && ankle.visibility >= 0.5) {
                    ctx.strokeStyle = SKELETON_AXIS;
                    ctx.lineWidth = Math.max(1.5, Math.round(w / 300));
                    ctx.setLineDash([6, 5]);
                    ctx.beginPath();
                    ctx.moveTo(ankle.x * w, 0.04 * h);
                    ctx.lineTo(ankle.x * w, Math.min(1, ankle.y + 0.05) * h);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            viewPointsOf(viewMode).forEach(idx => {
                const l = landmarks[idx];
                if (!l || l.visibility < 0.5) return;
                ctx.fillStyle = SKELETON_DOT;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1.5, Math.round(w / 420));
                ctx.beginPath();
                ctx.arc(l.x * w, l.y * h, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
        }

        // Canvas上にスコアラベルを描画
        function postureDrawScoreOnCanvas(ctx, w, h, analysis, viewMode, landmarks) {
            if (!analysis || !landmarks) return;
            const total = postureGetTotal(analysis);
            if (total === null) return;
            const scale = Math.max(1, w / 430);
            const pad = Math.round(8 * scale);
            // 総合スコアバッジ（左上）
            const badgeH = Math.round(30 * scale);
            const badgeW = Math.round(112 * scale);
            ctx.fillStyle = 'rgba(62,31,44,0.72)';
            roundRectPath(ctx, pad, pad, badgeW, badgeH, Math.round(8 * scale));
            ctx.fill();
            const circleR = Math.round(10.5 * scale);
            const cx = pad + Math.round(8 * scale) + circleR;
            const cy = pad + badgeH / 2;
            ctx.beginPath(); ctx.arc(cx, cy, circleR, 0, Math.PI * 2);
            ctx.strokeStyle = postureScoreColor(total); ctx.lineWidth = Math.round(2 * scale); ctx.stroke();
            ctx.fillStyle = postureScoreColor(total);
            ctx.font = `bold ${Math.round(10 * scale)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(total, cx, cy);
            ctx.textAlign = 'left';
            ctx.font = `bold ${Math.round(9 * scale)}px sans-serif`;
            ctx.fillText(postureScoreLabel(total), cx + circleR + Math.round(5 * scale), cy - Math.round(5 * scale));
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.font = `${Math.round(7 * scale)}px sans-serif`;
            ctx.fillText(viewLabelOf(viewMode) + '分析', cx + circleR + Math.round(5 * scale), cy + Math.round(6 * scale));

            analysis.items.forEach(item => {
                if (item.confidence != null && item.confidence < 0.5) return;
                const pos = itemOverlayPos(item, landmarks, viewMode);
                if (!pos) return;
                const px = pos.x * w, py = pos.y * h;
                const color = postureScoreColor(item.score);
                const fontLabel = Math.round(6.5 * scale);
                const fontScore = Math.round(9.5 * scale);
                const fontDetail = Math.round(5.5 * scale);
                const borderW = Math.round(3 * scale);
                ctx.font = `${fontLabel}px sans-serif`;
                const labelW = ctx.measureText(item.label).width;
                ctx.font = `bold ${fontScore}px sans-serif`;
                const scoreW = ctx.measureText(String(item.score)).width;
                const detailText = item.value + (item.valueCm ? ' / ' + item.valueCm : '');
                ctx.font = `${fontDetail}px sans-serif`;
                const detailW = ctx.measureText(detailText).width;
                const boxW = Math.max(labelW + scoreW + Math.round(8 * scale), detailW) + Math.round(12 * scale) + borderW;
                const boxH = Math.round(21 * scale);
                const bx = pos.align === 'center' ? px - boxW / 2 : pos.align === 'right' ? px - boxW : px;
                const by = pos.align === 'center' ? py - boxH : py - boxH / 2;
                ctx.fillStyle = 'rgba(62,31,44,0.74)';
                roundRectPath(ctx, bx + borderW, by, boxW - borderW, boxH, Math.round(4 * scale));
                ctx.fill();
                ctx.fillStyle = color;
                ctx.fillRect(bx, by, borderW, boxH);
                const tx = bx + borderW + Math.round(5 * scale);
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = `${fontLabel}px sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(item.label, tx, by + boxH * 0.32);
                ctx.fillStyle = color;
                ctx.font = `bold ${fontScore}px sans-serif`;
                ctx.fillText(String(item.score), tx + labelW + Math.round(4 * scale), by + boxH * 0.32);
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.font = `${fontDetail}px sans-serif`;
                ctx.fillText(detailText, tx, by + boxH * 0.74);
            });
        }

        function roundRectPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ロゴ入りウォーターマーク（右下）
        function drawBrandWatermark(ctx, w, h) {
            const scale = Math.max(1, w / 430);
            const chipH = Math.round(26 * scale);
            const logoSize = Math.round(20 * scale);
            ctx.font = `bold ${Math.round(9 * scale)}px "Zen Old Mincho", serif`;
            const text = 'Dear美容整体';
            const textW = ctx.measureText(text).width;
            const chipW = logoSize + textW + Math.round(18 * scale);
            const x = w - chipW - Math.round(8 * scale);
            const y = h - chipH - Math.round(8 * scale);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            roundRectPath(ctx, x, y, chipW, chipH, chipH / 2);
            ctx.fill();
            if (DEAR_LOGO_IMG && DEAR_LOGO_IMG.complete && DEAR_LOGO_IMG.naturalWidth > 0) {
                ctx.save();
                roundRectPath(ctx, x + Math.round(4 * scale), y + (chipH - logoSize) / 2, logoSize, logoSize, logoSize / 2);
                ctx.clip();
                ctx.drawImage(DEAR_LOGO_IMG, x + Math.round(4 * scale), y + (chipH - logoSize) / 2, logoSize, logoSize);
                ctx.restore();
            }
            ctx.fillStyle = '#904C63';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(text, x + logoSize + Math.round(9 * scale), y + chipH / 2 + 1);
        }

        // 写真+骨格+スコア+ブランドを合成した画像を生成
        function postureComposeImage(imageDataUrl, landmarks, analysis, viewMode, drawScore) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const c = document.createElement('canvas');
                        c.width = img.width; c.height = img.height;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        postureDrawSkeletonOnCanvas(ctx, img.width, img.height, landmarks, analysis, viewMode);
                        if (drawScore) postureDrawScoreOnCanvas(ctx, img.width, img.height, analysis, viewMode, landmarks);
                        drawBrandWatermark(ctx, img.width, img.height);
                        resolve(c.toDataURL('image/jpeg', 0.92));
                    } catch (e) { reject(e); }
                };
                img.onerror = () => reject(new Error('画像の読み込みに失敗'));
                img.src = imageDataUrl;
            });
        }

        // ビフォーアフター比較画像（横並び + ブランドヘッダー）
        async function postureCreateComparisonImage(beforeDataUrl, afterDataUrl, opts = {}) {
            const { viewLabel = '', customerName = '', beforeDate = '', afterDate = '', beforeScore = null, afterScore = null } = opts;
            const [imgB, imgA] = await Promise.all([loadImageEl(beforeDataUrl), loadImageEl(afterDataUrl)]);
            const maxH = Math.min(1350, Math.max(imgB.height, imgA.height));
            const wB = Math.round(imgB.width * (maxH / imgB.height));
            const wA = Math.round(imgA.width * (maxH / imgA.height));
            const gap = 6;
            const headerH = Math.round(maxH * 0.085);
            const labelH = Math.round(maxH * 0.055);
            const totalW = wB + gap + wA;
            const totalH = headerH + maxH + labelH;
            const c = document.createElement('canvas');
            c.width = totalW; c.height = totalH;
            const ctx = c.getContext('2d');
            // 背景（梅紫グラデーション）
            const grad = ctx.createLinearGradient(0, 0, totalW, 0);
            grad.addColorStop(0, '#522939'); grad.addColorStop(0.6, '#663347'); grad.addColorStop(1, '#904C63');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, totalW, totalH);
            // ヘッダー: ロゴチップ + タイトル
            const logoSize = Math.round(headerH * 0.68);
            const hx = Math.round(headerH * 0.2);
            const hy = Math.round((headerH - logoSize) / 2);
            ctx.fillStyle = '#fff';
            roundRectPath(ctx, hx, hy, logoSize, logoSize, Math.round(logoSize * 0.24));
            ctx.fill();
            if (DEAR_LOGO_IMG && DEAR_LOGO_IMG.complete && DEAR_LOGO_IMG.naturalWidth > 0) {
                ctx.save();
                roundRectPath(ctx, hx, hy, logoSize, logoSize, Math.round(logoSize * 0.24));
                ctx.clip();
                ctx.drawImage(DEAR_LOGO_IMG, hx, hy, logoSize, logoSize);
                ctx.restore();
            }
            ctx.fillStyle = '#F6D2CF';
            ctx.font = `bold ${Math.round(headerH * 0.3)}px "Zen Old Mincho", serif`;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText('Dear美容整体', hx + logoSize + Math.round(headerH * 0.2), headerH * 0.36);
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.font = `bold ${Math.round(headerH * 0.24)}px sans-serif`;
            ctx.fillText(`${viewLabel} ビフォーアフター${customerName ? '　' + customerName + ' 様' : ''}`, hx + logoSize + Math.round(headerH * 0.2), headerH * 0.72);
            // 金の飾り線
            ctx.fillStyle = '#C0B084';
            ctx.fillRect(0, headerH - 2, totalW, 2);
            // 写真
            ctx.drawImage(imgB, 0, headerH, wB, maxH);
            ctx.drawImage(imgA, wB + gap, headerH, wA, maxH);
            // 中央仕切り
            ctx.fillStyle = '#fff';
            ctx.fillRect(wB, headerH, gap, maxH);
            // ラベル帯
            ctx.fillStyle = 'rgba(62,31,44,0.92)';
            ctx.fillRect(0, headerH + maxH, totalW, labelH);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const ly = headerH + maxH + labelH / 2;
            ctx.font = `bold ${Math.round(labelH * 0.42)}px sans-serif`;
            ctx.fillStyle = '#F2BBB6';
            ctx.fillText('BEFORE' + (beforeDate ? '  ' + fmtDateShort(beforeDate) : '') + (beforeScore != null ? `  ${beforeScore}点` : ''), wB / 2, ly);
            ctx.fillStyle = '#fff';
            ctx.fillText('AFTER' + (afterDate ? '  ' + fmtDateShort(afterDate) : '') + (afterScore != null ? `  ${afterScore}点` : ''), wB + gap + wA / 2, ly);
            return c.toDataURL('image/jpeg', 0.9);
        }

        // ============================================================
        // PDFシート描画（A4縦 1654×2339px ≒ 200dpi）
        // ============================================================
        const PDF_W = 1654, PDF_H = 2339;

        function pdfDrawHeader(ctx, title, subtitle, issueDate) {
            // 上部帯
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, PDF_W, PDF_H);
            const grad = ctx.createLinearGradient(0, 0, PDF_W, 0);
            grad.addColorStop(0, '#522939'); grad.addColorStop(0.6, '#663347'); grad.addColorStop(1, '#904C63');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, PDF_W, 190);
            ctx.fillStyle = '#C0B084';
            ctx.fillRect(0, 190, PDF_W, 5);
            // ロゴチップ
            const logoSize = 128;
            ctx.fillStyle = '#fff';
            roundRectPath(ctx, 62, 31, logoSize, logoSize, 26);
            ctx.fill();
            if (DEAR_LOGO_IMG && DEAR_LOGO_IMG.complete && DEAR_LOGO_IMG.naturalWidth > 0) {
                ctx.save();
                roundRectPath(ctx, 62, 31, logoSize, logoSize, 26);
                ctx.clip();
                ctx.drawImage(DEAR_LOGO_IMG, 62, 31, logoSize, logoSize);
                ctx.restore();
            }
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = '#F2BBB6';
            ctx.font = 'bold 34px "Zen Old Mincho", serif';
            ctx.fillText('Dear美容整体', 218, 80);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 56px "Zen Old Mincho", serif';
            ctx.fillText(title, 218, 148);
            if (subtitle) {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(subtitle, PDF_W - 64, 96);
            }
            if (issueDate) {
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('発行日 ' + issueDate, PDF_W - 64, 140);
            }
            ctx.textAlign = 'left';
        }

        function pdfDrawFooter(ctx, pageNum, pageTotal) {
            ctx.fillStyle = '#C0B084';
            ctx.fillRect(64, PDF_H - 96, PDF_W - 128, 2);
            ctx.fillStyle = '#904C63';
            ctx.font = 'bold 26px "Zen Old Mincho", serif';
            ctx.textAlign = 'center';
            ctx.fillText('Dear美容整体　—　骨盤矯正・小顔矯正', PDF_W / 2, PDF_H - 52);
            ctx.fillStyle = '#B08A96';
            ctx.font = '22px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${pageNum} / ${pageTotal}`, PDF_W - 64, PDF_H - 52);
            ctx.textAlign = 'left';
        }

        // 9枚つらなり写真グリッドページ
        async function renderPhotoGridPage(photos, opts) {
            const { customerName = '', pageNum = 1, pageTotal = 1, issueDate = todayLocalYMD() } = opts;
            const c = document.createElement('canvas');
            c.width = PDF_W; c.height = PDF_H;
            const ctx = c.getContext('2d');
            pdfDrawHeader(ctx, '姿勢分析レポート', customerName ? customerName + ' 様' : '', fmtDateShort(issueDate));

            const gridTop = 240, gridBottom = PDF_H - 130;
            const gridLeft = 64, gridRight = PDF_W - 64;
            const cols = 3, rows = 3, gapX = 22, gapY = 26;
            const cellW = Math.floor((gridRight - gridLeft - gapX * (cols - 1)) / cols);
            const cellH = Math.floor((gridBottom - gridTop - gapY * (rows - 1)) / rows);
            const labelH = 64;
            const imgH = cellH - labelH;

            for (let i = 0; i < 9; i++) {
                const col = i % 3, row = Math.floor(i / 3);
                const x = gridLeft + col * (cellW + gapX);
                const y = gridTop + row * (cellH + gapY);
                const p = photos[i];
                // セル枠
                ctx.fillStyle = '#FDF6F5';
                roundRectPath(ctx, x, y, cellW, cellH, 14);
                ctx.fill();
                ctx.strokeStyle = '#E9CFC9';
                ctx.lineWidth = 2;
                roundRectPath(ctx, x, y, cellW, cellH, 14);
                ctx.stroke();
                if (!p) {
                    ctx.fillStyle = '#D9B8B2';
                    ctx.font = '26px sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('—', x + cellW / 2, y + cellH / 2);
                    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
                    continue;
                }
                try {
                    const img = await loadImageEl(p.image);
                    // cover配置で中央クロップ
                    ctx.save();
                    roundRectPath(ctx, x, y, cellW, imgH, 14);
                    ctx.clip();
                    const scale = Math.max(cellW / img.width, imgH / img.height);
                    const dw = img.width * scale, dh = img.height * scale;
                    ctx.drawImage(img, x + (cellW - dw) / 2, y + (imgH - dh) / 2, dw, dh);
                    ctx.restore();
                } catch (_) {}
                // 日付チップ（左上）
                const dateText = fmtDateShort(p.date);
                ctx.font = 'bold 22px sans-serif';
                const dtW = ctx.measureText(dateText).width + 24;
                ctx.fillStyle = 'rgba(62,31,44,0.78)';
                roundRectPath(ctx, x + 10, y + 10, dtW, 38, 19);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.textBaseline = 'middle';
                ctx.fillText(dateText, x + 22, y + 30);
                // フェーズチップ（右上）
                if (p.phase) {
                    const phText = p.phase === 'after' ? 'AFTER' : 'BEFORE';
                    ctx.font = 'bold 20px sans-serif';
                    const phW = ctx.measureText(phText).width + 22;
                    ctx.fillStyle = p.phase === 'after' ? 'rgba(201,77,77,0.9)' : 'rgba(144,76,99,0.9)';
                    roundRectPath(ctx, x + cellW - phW - 10, y + 10, phW, 36, 18);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillText(phText, x + cellW - phW + 1, y + 29);
                }
                // 下部ラベル
                ctx.fillStyle = '#3E2A31';
                ctx.font = 'bold 26px sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText(viewLabelOf(p.viewMode), x + 16, y + imgH + labelH / 2);
                if (p.totalScore != null) {
                    const sc = p.totalScore;
                    ctx.fillStyle = postureScoreColor(sc);
                    ctx.font = 'bold 30px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(sc + '点', x + cellW - 16, y + imgH + labelH / 2);
                    ctx.textAlign = 'left';
                }
                ctx.textBaseline = 'alphabetic';
            }
            pdfDrawFooter(ctx, pageNum, pageTotal);
            return c.toDataURL('image/jpeg', 0.88);
        }

        // 採寸履歴表ページ
        function renderMeasurementPage(measurementSets, opts) {
            const { customerName = '', pageNum = 1, pageTotal = 1, issueDate = todayLocalYMD() } = opts;
            const sets = measurementSets.slice(-5); // 直近5回分
            const c = document.createElement('canvas');
            c.width = PDF_W; c.height = PDF_H;
            const ctx = c.getContext('2d');
            pdfDrawHeader(ctx, '採寸記録（サイズ変化）', customerName ? customerName + ' 様' : '', fmtDateShort(issueDate));

            const tableLeft = 64, tableRight = PDF_W - 64;
            const labelColW = 340;
            const dataColW = (tableRight - tableLeft - labelColW) / Math.max(1, sets.length);
            let y = 260;
            const rowH = 74;

            // ヘッダー行
            ctx.fillStyle = '#663347';
            roundRectPath(ctx, tableLeft, y, tableRight - tableLeft, rowH, 12);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 28px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText('測定部位', tableLeft + 24, y + rowH / 2);
            sets.forEach((s, i) => {
                ctx.textAlign = 'center';
                ctx.font = 'bold 26px sans-serif';
                ctx.fillText(fmtDateShort(s.date), tableLeft + labelColW + dataColW * i + dataColW / 2, y + rowH / 2 - 12);
                ctx.font = '20px sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(i === 0 ? '初回測定' : `${i + 1}回目`, tableLeft + labelColW + dataColW * i + dataColW / 2, y + rowH / 2 + 16);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
            });
            y += rowH + 6;

            const drawRow = (label, values, isGroup) => {
                if (isGroup) {
                    ctx.fillStyle = '#F1E2E9';
                    roundRectPath(ctx, tableLeft, y, tableRight - tableLeft, 52, 8);
                    ctx.fill();
                    ctx.fillStyle = '#904C63';
                    ctx.font = 'bold 25px sans-serif';
                    ctx.fillText(label, tableLeft + 24, y + 26);
                    y += 58;
                    return;
                }
                ctx.fillStyle = '#3E2A31';
                ctx.font = '25px sans-serif';
                ctx.fillText(label, tableLeft + 24, y + 28);
                values.forEach((v, i) => {
                    ctx.textAlign = 'center';
                    const cxp = tableLeft + labelColW + dataColW * i + dataColW / 2;
                    if (v == null || v === '') {
                        ctx.fillStyle = '#C9AEB6';
                        ctx.fillText('—', cxp, y + 28);
                    } else {
                        ctx.fillStyle = '#3E2A31';
                        ctx.font = 'bold 26px sans-serif';
                        ctx.fillText(v + '', cxp, y + 22);
                        // 前回比
                        if (i > 0 && values[i - 1] != null && values[i - 1] !== '') {
                            const diff = Math.round((parseFloat(v) - parseFloat(values[i - 1])) * 10) / 10;
                            if (!isNaN(diff) && diff !== 0) {
                                ctx.font = 'bold 20px sans-serif';
                                ctx.fillStyle = diff < 0 ? '#2F9C7C' : '#DA7A3C';
                                ctx.fillText((diff > 0 ? '+' : '') + diff, cxp, y + 50);
                            }
                        }
                        ctx.font = '25px sans-serif';
                    }
                    ctx.textAlign = 'left';
                });
                y += 64;
                ctx.strokeStyle = '#F3DFDC';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(tableLeft, y - 6); ctx.lineTo(tableRight, y - 6); ctx.stroke();
            };

            // 体重行
            if (sets.some(s => s.weight)) {
                drawRow('体重 (kg)', sets.map(s => s.weight || null));
            }
            MEASUREMENT_GROUPS.forEach(g => {
                drawRow(g, null, true);
                MEASUREMENT_SITES.filter(site => site.group === g).forEach(site => {
                    drawRow(site.label + ' (cm)', sets.map(s => (s.values && s.values[site.key]) || null));
                });
            });

            pdfDrawFooter(ctx, pageNum, pageTotal);
            return c.toDataURL('image/jpeg', 0.9);
        }

        const buildComparisonFlexMessage = ({ customerName, visitDate, staffName, pairs, imageUrls }) => {
